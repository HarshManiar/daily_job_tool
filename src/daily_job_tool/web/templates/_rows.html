{% from "_card.html" import card %}
{% for r in rows %}{{ card(r, now, since, (r.id == selected_id), here, excluded) }}{% endfor %}
{% if has_more %}
<li class="more" hx-get="{{ base_path }}?{{ next_qs }}" hx-trigger="intersect once, click" hx-target="this" hx-swap="outerHTML" hx-push-url="false"><button class="btn ghost" type="button">Load more</button></li>
{% endif %}
