<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
<title>{% block title %}Daily Job Tool{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Daily Job Tool</a>
  <nav>
    <a href="/" {% if page == 'feed' %}aria-current="page"{% endif %}>My matches</a>
    <a href="/filtered" {% if page == 'filtered' %}aria-current="page"{% endif %}>Filtered out</a>
    <a href="/health" {% if page == 'health' %}aria-current="page"{% endif %}>Health</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="foot"><a href="/bot">About DailyJobToolBot</a> · local, single-user</footer>
</body>
</html>
