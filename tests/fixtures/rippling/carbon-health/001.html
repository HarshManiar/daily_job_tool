p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:10pt;font-weight:400;line-height:1.6;letter-spacing:0.25px;margin:4px 0px;padding:0px;'><span style=\"color:rgb(0,0,0);background-color:rgb(255,255,255);font-size:11pt;white-space:pre-wrap;\">As a physician-founded and led organization, ensuring everyone has access to quality healthcare is what inspires us. The magic we\u2019ve created lies in Carbon Health\u2019s custom EHR and the collaboration among clinical teams, engineers, and designers who work side-by-side to deliver innovation like our hands free AI charting tool. That\u2019s why we hire people who genuinely care about patients, solving healthcare challenges, and making a positive impact every day. Join us and help change the future of healthcare for the better.</span></p></body></div>", "role": "<div><body><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Area Medical Director</strong></b></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Physician (MD/DO), Nurse Practitioner, or Physician Assistant</strong></b></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><i><em style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Lead 10\u201315 clinics. Practice medicine. Build the career you've been preparing for.</em></i></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">The Opportunity</strong></b></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Carbon Health is a technology-enabled healthcare company operating 75+ urgent care and 20 primary care clinics across California, New Jersey, Washington, Massachusetts, and beyond, powered by care delivery software we build ourselves. As we expand our hybrid urgent care + primary care model and grow our value-based care programs, we're looking for clinician leaders ready to step into true market-level ownership.</span></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">As Area Medical Director, you'll own the clinical and operational performance of 10\u201315 clinics in your market: quality of care, provider development, patient experience, and financial results, while continuing to practice medicine roughly 10 hours per week. You'll lead a team of Center Medical Directors and partner with operations leadership, with direct visibility to our national clinical leadership team.</span></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">This role is built for the clinician who has led a site, a team, or a service line and is ready for something bigger. You don't need to arrive as a finished executive. You need the leadership instincts, the clinical credibility, and the drive. We'll invest in developing the rest.</span></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">What You'll Own</strong></b></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 5pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Clinical Excellence</strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Set and uphold quality and safety standards across your market, in partnership with your Center Medical Directors</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Deliver evidence-based, compassionate urgent care and/or primary care (~10 hrs/week), staying credible where care actually happens</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px 12pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Champion clinical initiatives \u2014 from chronic disease recognition programs to procedural competency \u2014 and adapt national playbooks to your market</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 3pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">People Leadership</strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Recruit, coach, and develop Center Medical Directors and providers \u2014 building the next generation of clinical leaders in your market</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Drive provider engagement and retention by modeling ownership, transparency, and a culture where clinicians want to build their careers</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px 12pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Lead performance conversations with fairness and clarity, using data-informed coaching rather than gut feel</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 3pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Operational &amp; Financial Performance</strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Own the day-to-day clinical operations of your centers: patient flow, staffing models, access, and patient experience</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Partner on P&amp;L performance with structured support to build your financial fluency</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Grow your market through occupational health, community partnerships, and referral relationships with surrounding practices</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px 12pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Report regularly to national leadership on the state of your market \u2014 with the autonomy to act on what you see</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 5pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">What You Bring</strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Active, unrestricted license as a Physician (MD/DO), Nurse Practitioner, or Physician Assistant, with national certification as applicable; BLS/ACLS required by start date, DOT certification required</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">5+ years of clinical experience in urgent care, emergency medicine, or a similar acute/ambulatory setting; comfortable treating patients of all ages</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">2+ years of demonstrated leadership as a medical director, lead clinician, site lead, or comparable role where others looked to you to set the standard</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Exposure to the business side of medicine \u2014 schedules, staffing, metrics, or budgets \u2014 and genuine curiosity to go deeper</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px 12pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">The soft skills that make hard jobs work: active listening, trust-building at every level, and the judgment to manage ambiguity without waiting for perfect information</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 11pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">What We'll Develop In You</strong></b></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 5pt;padding:0px;'><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">We hire for leadership potential and clinical credibility and build business acumen deliberately. As an Area Medical Director, you'll get:</span></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Structured P&amp;L and financial management coaching, including productivity models, labor economics, and coding/reimbursement fluency</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">A leadership development pathway with mentorship from national clinical leadership and a peer community of Area Medical Directors across our markets</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px 12pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Real decision-making authority early. This is leadership development by doing, not by shadowing</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 5pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Why This Role, Why Now</strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Scale that matters: a multi-state platform where what you build in your market can shape how care is delivered nationally</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Technology that works for clinicians: you'll practice on software our own teams build, and your feedback shapes the product</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">A hybrid care model on the front edge of where healthcare is going: urgent care access, primary care continuity, and growing value-based care programs</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px 12pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Clinical leadership that practices: our medical leaders see patients, and we protect that</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 3pt;padding:0px;'><i><em style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">If you've been the person your colleagues turn to \u2014 and you're ready to lead at scale \u2014 we want to talk to you. Carbon Health is an equal opportunity employer committed to building a diverse and inclusive team.</em></i></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 3pt;padding:0px;'><br></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:0pt 0px 3pt;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Physician Salary:</strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><span style=\"white-space:pre-wrap;\">$210,000 - $280,000</span></li></ul><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.6;letter-spacing:0.25px;margin:4px 0px;padding:0px;'><br></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.6;letter-spacing:0.25px;margin:4px 0px;padding:0px;'><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">NP/PA Salary: </strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"margin:3px 0px;font-size:11pt;line-height:1.6;letter-spacing:0.25px;\"><span style=\"white-space:pre-wrap;\">$150,000 - $215,000</span></li></ul></body></div>"}, "workLocations": ["Ocean Township, NJ", "Green Brook, NJ", "Monroe Township, NJ", "Montgomery, NJ", "Browns Mills, NJ", "Evesham, NJ", "Wall Township, NJ"], "department": {"name": "Clinicians", "base_department": "Clinicians", "department_tree": ["Clinicians"]}, "employmentType": {"label": "SALARIED_FT", "id": "Salaried, full-time"}, "createdOn": "2026-07-22T11:43:35.834000-07:00", "eeocQuestionnaireEnabled": true, "eeocQuestionnaireEnabledForJobPost": true, "url": "https://ats.rippling.com/carbon-health/jobs/b34362b9-43df-45aa-bc0b-4d5807f61f65", "board": {"boardType": "RIPPLING", "slug": "carbon-health", "logo": {"name": "Logo_-_Color@3x.jpg", "url": "https://secured-assets.ripplingcdn.com/us1/ats/690e1cfa78c34e089305d013/ats_public/f325e4566413419dba85cc9548899597-sensitive.jpg?Expires=1794520680&Signature=LzCvgdi49YAF6nPx8uJoccDldqVquhL5~h8kgv1x8t9wJJDM8UrCWk5e8nb16QXiQJFtu89J-OoqJKNV-2-J24hVssslqc4wZnKrqBifhE8yMamyzx~-6X7UoMX7qILo9md0R7iPciDE0e0RsYm4W5xMHJUTBUlRUJr-PbPOjkU2G-iTf~qh1-aFqTqwx0U9lPyXAehk5WTspLsrVSDA~Zoad2Y5py7ITQzMpvNBsTzkIYwOP7EFrUQ~6xL7~0t1FBBLAgN~nq8D~ixcLB7H3~fyvFs1murbaUY4BttG0izN7DKOIusKVL98QF9E1VJFc114MUAsNznaiV5SkxTVtg__&Key-Pair-Id=K2SM3GXN9F9XGM", "type": "image/jpeg"}, "banner": {"name": "", "url": null, "type": ""}, "title": "Carbon Health", "subtitle": "Careers at Carbon Health", "boardURL": "https://ats.rippling.com/carbon-health/jobs", "fontType": null, "linkColor": null, "buttonColor": null, "buttonTextColor": null, "legalNotice": "<meta name=\"rteConfig\" content=\"{&quot;version&quot;:&quot;0.393.0&quot;,&quot;producedBy&quot;:&quot;block&quot;,&quot;themeName&quot;:&quot;berry&quot;}\"><p style=\"font-family:&quot;Basel Grotesk&quot;,Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.6;letter-spacing:0.25px;margin:4px 0px;padding:0px;\"><a href=\"https://ca
