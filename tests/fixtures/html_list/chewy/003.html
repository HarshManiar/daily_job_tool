<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Chewy","value":"R31223"},"hiringOrganization":{"@type":"Organization","name":"Chewy","sameAs":"https://careers.chewy.com/us/en","url":"https://careers.chewy.com/us/en/job/R31223/Credentialed-Veterinary-Technician","logo":"https://assets.phenompeople.com/CareerConnectResources/prod/CHINUS/images/job_logo_config-1630667272777.jpg"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"39.61332","longitude":"-105.01665"},"address":{"@type":"PostalAddress","postalCode":"80123","addressCountry":"United States of America","addressLocality":"Littleton","addressRegion":"Colorado"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;Job Description:&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Our Opportunity:&lt;/b&gt;&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;At Chewy Vet Care, we’re changing the veterinary care experience! It starts by crafting an environment that veterinary teams can use to succeed every day. With the launch of our new veterinary practices, we are looking for a full-time&lt;b&gt; Credentialed Veterinary Technician&lt;/b&gt; to join our Healthcare Practice Team. Work in a practice designed from the ground up by veterinarians, equipped with advanced equipment and purpose-built technology so that you can practice your best medicine and focus on patient and pet parent care.  We offer a customer- and team member-centric environment, where together, we deliver care that starts with a visit and lasts a lifetime!&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;We are a comprehensive veterinary practice that delivers personalized, patient-centric care. Our mission is clear - to become the most trusted and convenient destination for pet parents and partners, everywhere. This is an opportunity to join the industry leader that not only cares about what you do, but what you need as a person. We’ll provide competitive benefits, scheduling options that fit different lifestyles, and a collaborative work environment where we can our full potential! Join the team that understands that caring for the pets we love starts with greater care for our veterinary Team Members.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;&lt;span&gt;&lt;/span&gt;&lt;/b&gt;&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;What You&#39;ll Do:&lt;/b&gt;&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Serve to support the practice’s team, setting the bar for providing high-level, proficient veterinary medical care and embodying the Chewy mission to work together with your peers and deliver the pet parent WOW experience. &lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Responsible for implementing the outlined policies and procedures, using integrated technology, and delivering consistent and appropriate medical care within the given skills.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;All listed technician skills (Veterinary Technician I and Veterinary Technician II) along with skills such as team member training, inventory management, mentoring Team Members, and handling client complaints.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Patient care (blood transfusion, Oxygen cage, cardiac monitoring); dentistry; wound care; catheter placement, anesthesia monitoring (unstable, high-risk patients) and performing functions that require handling animal bodily fluids and tissues.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Demonstrate team support and care for others’ work experiences.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Understand and follow the practice’s Standard Operating Procedures (SOPs) and Standards of Care (SOC)&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Communicate clearly and respectfully with other Team Members, keeping veterinarians updated in real time on patient updates (in practice, at referral, and under home care).&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Be a PIMS administrative super-user and aid others on the team in their use of the technology. &lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Act responsibly given the pharmacy holdings of the practice and keep controlled substance logs.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Assist practice manager with communicating on inventory needs. &lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Clean workspaces after every patient or patient lab sample interaction.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Participation in self-development courses and Chewy Vet Care required compliance training.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Perform related duties and assignments as advised by management.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Any other responsibilities as deemed vital within the scope of role.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;May be required to work weekends, position may require some travel.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;&lt;span&gt;&lt;/span&gt;&lt;/b&gt;&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;What You’ll Need&lt;/b&gt;:&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Successful completion of an accredited veterinary technology program and current licensure is preferred.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Demonstrated ability to complete the veterinary technician skills checklist for Veterinary Technician III&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;5&#43; years of experience as a Veterinary Technician in practice is preferred.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Strong ability to connect with clients and demonstrate compassion.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Excellent verbal / written communication, observational, and analytical skills.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Thrives in a fast paced, self-starter environment.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;&lt;span&gt;&lt;/span&gt;&lt;/b&gt;&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Physical Job Requirements:&lt;/b&gt; &lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Standing or walking up to 80% per shift.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Frequently lift up to 50 to 70 pounds using an optional team lift.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Occasionally lift greater than 70&#43; pounds using a team lift.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Stand, push, pull, carry, squat, and kneel.&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt; &lt;/p&gt;The hourly range for this role is $0.00 - $0.00.&lt;ul&gt;&lt;li&gt;&lt;p&gt;The specific hourly range offered to a candidate may be influenced by a variety of factors including but not limited to the candidate’s relevant experience, education, and work location. In addition, this position is eligible for 401k.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;We offer different types of insurance and benefits, such as medical/Rx, vision, dental, life, disability, hospital indemnity, critical illness, and accident. We offer parental leave, family services benefits, backup dependent care, flexible spending accounts, telemedicine, pet adoption reimbursement, employee assistance program, and many discounts including 10% off pet insurance and 20% off at Chewy.com.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Non-exempt hourly team members accrue paid time off (PTO) and are eligible for additional unplanned unpaid time off (UTO). Team members will receive six paid holidays per year. Team members may be eligible for paid sick and family leave in compliance with applicable state and local regulations.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Chewy Vet Care is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, ancestry, national origin, gender, citizenship, marital status, religion, age, disability, gender identity, results of genetic testing, veteran status, as well as any other legally-protected characteristic. If you have a disability under the Americans with Disabilities Act or similar law, and you need an accommodation during the application process or to perform these job requirements, or if you need a religious accommodation, please contact &lt;a target=\"_blank\" href=\"mailto:CAAR&#64;chewy.com\"&gt;CAAR&#64;chewy.com&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;To access Chewy&#39;s California CPRA Job Applicant Privacy Policy, please click &lt;a target=\"_blank\" href=\"https://chewyinc.phenompro.com/us/en/privacy-policy\"&gt;here&lt;/a&gt;.&lt;/p&gt;","title":"Credentialed Veterinary Technician","datePosted":"2026-10-30","@context":"http://schema.org","occupationalCategory":"Veterinary","directApply":false}</script>
