<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Chewy","value":"R30723"},"hiringOrganization":{"@type":"Organization","name":"Chewy","sameAs":"https://careers.chewy.com/us/en","url":"https://careers.chewy.com/us/en/job/R30723/Functional-Developer-II-Oracle-ERP-Finance","logo":"https://assets.phenompeople.com/CareerConnectResources/prod/CHINUS/images/job_logo_config-1630667272777.jpg"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"26.13421","longitude":"-80.23184"},"address":{"@type":"PostalAddress","postalCode":"33322","addressCountry":"United States of America","addressLocality":"Plantation","addressRegion":"Florida"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;Job Description:&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Our Opportunity&lt;/span&gt;&lt;/p&gt;&lt;p&gt;Every order a pet parent places at Chewy eventually becomes a financial transaction: a tax calculation, a cost calculation, a rebate accrual, an invoice match, a vendor payment, and an accounting entry. FinTech team owns the platforms that get all of it right, across billions of dollars in annual net sales and millions of transactions a month. That includes inventory adjustments streaming in from our warehouse management systems, and for our growing B2B business the full order-to-cash lifecycle, which we brought live recently and are still shaping.&lt;/p&gt;&lt;p&gt;We are hiring a Functional Developer II – Oracle ERP Finance to design and build on that platform. You will work deep in Oracle Fusion Cloud ERP  Accounts Payable, Accounts Receivable, General Ledger, Cash Management, Cost Management, and Fixed Assets and across the ecosystem that surrounds it: Coupa for procure-to-pay, Vertex for tax determination, and a growing layer of APIs, microservices, and event streams that extend Oracle ERP well past what it does out of the box.&lt;/p&gt;&lt;p&gt;This is not a keep-the-lights-on configuration seat. Our roadmap includes standing up the finance and tax architecture for Chewy’s new initiatives, migrating acquired businesses off legacy ERPs onto Oracle Fusion, modernizing how ERP data reaches the rest of the enterprise, and putting Oracle’s new AI and agentic capabilities to work on real close, reconciliation, and payables processes. You will own workstreams across all of it from the whiteboard through go-live and stabilization.&lt;/p&gt;&lt;p&gt;And if you know Oracle Financials deeply &lt;i&gt;and&lt;/i&gt; you know tax Oracle Fusion Tax, Vertex, Indirect tax determination in a high-volume retail and e-commerce environment you will go straight to the top of our list.&lt;/p&gt;&lt;h2&gt;What You’ll Do&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;End-to-end functional solution design across Oracle Fusion Financials: requirements, process design, configuration, functional specifications, data and integration requirements, testing, documentation, and production readiness.&lt;/li&gt;&lt;li&gt;The partnership with Finance, Accounting, Tax, Product, and Engineering — translating complex accounting requirements into scalable solutions, and evaluating the accounting, operational, control, and downstream impacts of every design decision.&lt;/li&gt;&lt;li&gt;Implementation of new Oracle modules and capabilities, plus continuous modernization of existing ones as the business grows and requirements change.&lt;/li&gt;&lt;li&gt;Extending Oracle beyond standard functionality alongside Engineers and Architects REST APIs, microservices, event-driven and file-based integrations including the data mappings and accounting rules behind purchase orders, receipts, invoices, payments, journals, and cash receipts.&lt;/li&gt;&lt;li&gt;Oracle BI Publisher reports and data models supporting Finance reporting, reconciliations, integrations, and daily operations.&lt;/li&gt;&lt;li&gt;Merger and acquisition support: assessing acquired companies’ finance systems and processes, then designing and executing their migration into Oracle Fusion Cloud ERP.&lt;/li&gt;&lt;li&gt;Finding and eliminating manual work simplifying processes, automating what should be automated, strengthening financial controls, and driving adoption of native Oracle capability over custom workarounds.&lt;/li&gt;&lt;li&gt;Functional testing through SIT, UAT, and regression, plus defect resolution, deployment, and post-production stabilization with solutions that hold up to audit, data integrity, and segregation-of-duties requirements.&lt;/li&gt;&lt;li&gt;Oracle Fusion quarterly releases and upgrades from the functional side: impact assessment, regression testing, new-feature evaluation, and adoption planning. When production breaks, you drive root cause with Oracle Support and internal Engineering.&lt;/li&gt;&lt;li&gt;Evaluation of emerging Oracle Fusion capabilities  AI, automation, and agent-based features and bringing the ones that actually matter into Finance and Accounting processes.&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;What You’ll Need&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;3&#43; years working with enterprise ERP or financial systems in functional consulting, implementation, solution delivery, or support including 3&#43; years hands-on with Oracle Fusion Cloud Financials.&lt;/li&gt;&lt;li&gt;Deep functional expertise across multiple Fusion Financials modules — Accounts Payable, Accounts Receivable, General Ledger, Cash Management, Cost Management, Fixed Assets — and a real command of how transactions flow from subledgers into the General Ledger.&lt;/li&gt;&lt;li&gt;A track record of turning complex Finance and Accounting requirements into configurations, functional specifications, workflows, integrations, and reports that survive contact with production.&lt;/li&gt;&lt;li&gt;Experience defining functional requirements and data mappings for integrations between Oracle ERP and upstream and downstream enterprise applications.&lt;/li&gt;&lt;li&gt;Hands-on experience building and supporting Oracle BI Publisher reports and data models.&lt;/li&gt;&lt;li&gt;Experience across ERP implementations, module rollouts, upgrades, or migrations, plus production support — troubleshooting functional and data issues and working service requests with Oracle Support.&lt;/li&gt;&lt;li&gt;Command of testing methodology (functional, integration, regression, UAT) and the discipline to design for financial controls and auditability from the start, not as a retrofit.&lt;/li&gt;&lt;li&gt;Strong communication across Finance, Accounting, business, and Engineering teams, and the ability to independently own a workstream from requirements through production in a fast-paced Agile environment.&lt;/li&gt;&lt;li&gt;Bachelor’s degree in Computer Science, Information Systems, Finance, Accounting, Engineering, or a related field — or equivalent professional experience.&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;Bonus&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Oracle Fusion Tax, Vertex, or other indirect tax engines integrated with Oracle Fusion ERP or enterprise commerce platforms. This one counts for a lot on our team.&lt;/li&gt;&lt;li&gt;M&amp;A ERP integrations, financial-system consolidations, or migrations from legacy ERP platforms onto Oracle Fusion Cloud ERP.&lt;/li&gt;&lt;li&gt;REST APIs, FBDI, ADFdi, and other Oracle integration frameworks from a functional design perspective.&lt;/li&gt;&lt;li&gt;OTBI, Financial Reporting Center, and the broader Oracle reporting and analytics stack.&lt;/li&gt;&lt;li&gt;Finance automation work: three-way matching, reconciliation, cash application, landed cost, or complex accounting integrations.&lt;/li&gt;&lt;li&gt;One or more Oracle Fusion Cloud Financials certifications.&lt;/li&gt;&lt;li&gt;Retail, e-commerce, marketplace, supply chain, or other high-volume transaction environments.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;#LI-SA2&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Chewy is an equal opportunity employer. All qualified applicants will receive consideration for employment
