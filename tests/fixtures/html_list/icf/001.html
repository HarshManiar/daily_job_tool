<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"IIIIIIUS","value":"R2603172"},"hiringOrganization":{"@type":"Organization","name":"IIIIIIUS","sameAs":"https://careers.icf.com/us/en","url":"https://careers.icf.com/us/en/job/R2603172/Environment-and-Safety-Officer","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"28.63576","longitude":"77.22445"},"address":{"@type":"PostalAddress","postalCode":"110001","addressCountry":"India","addressLocality":"New Delhi","addressRegion":""},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;Description&lt;/p&gt;&lt;p&gt;ICF (NASDAQ:ICFI) is a global consulting services company with over 9,000 full- and part-time employees, but we are not your typical consultants. At ICF, business analysts and policy specialists work together with digital strategists, data scientists and creatives. We combine unmatched industry expertise with cutting-edge engagement capabilities to help organizations solve their most complex challenges. Since 1969, public and private sector clients have worked with ICF to navigate change and shape the future. Learn more at icf.com&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Position Summary :&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Lead environmental sustainability and occupational health and safety support for renewable energy schemes, including Floating Solar PV and solar pumping applications. The role focuses on aquatic and groundwater safeguards, safe materials, EPR and end-of-life compliance, incident management and emergency preparedness. &lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Job Description:&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Establish baseline water-quality parameters and monitor post-commissioning trends for Floating Solar PV sites, as applicable. &lt;/p&gt;&lt;p&gt;Review dissolved oxygen, BOD/COD, temperature profiles, turbidity and algae-bloom dynamics using approved monitoring protocols. &lt;/p&gt;&lt;p&gt;Assess potential impacts of array coverage on sunlight penetration, fish habitats, benthic organisms and migratory waterfowl. &lt;/p&gt;&lt;p&gt;Review use of certified non-toxic materials and controls against chemical leaching or polymer degradation in drinking and irrigation reservoirs. &lt;/p&gt;&lt;p&gt;Apply knowledge of RoHS, polymer non-toxicity, UV-stabilization and related material-safety requirements. &lt;/p&gt;&lt;p&gt;Promote safe offshore and water-based work practices, including flotation devices, safety boats, rescue arrangements and life-buoy stations. &lt;/p&gt;&lt;p&gt;Support groundwater conservation and integration of micro-irrigation with solar pumping in critical and semi-critical areas. &lt;/p&gt;&lt;p&gt;Monitor Extended Producer Responsibility and end-of-life disposal or recycling for PV modules, pump motors and electronic controllers. &lt;/p&gt;&lt;p&gt;Maintain and review site incident registers, investigate near misses and accidents, and conduct Root Cause Analysis. &lt;/p&gt;&lt;p&gt;Audit compliance with site-specific emergency-response plans and Environmental and Social Management Plans. &lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Minimum qualifications and experience:&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Bachelor&#39;s degree in Environmental Engineering, Environmental Science, Civil Engineering, Chemical Engineering, or Occupational Health &amp; Safety. A Master&#39;s degree in Environmental Management is preferred. &lt;/p&gt;&lt;p&gt;Minimum 5 years of relevant experience in environmental impact assessment, ecological monitoring and occupational health and safety governance in the power or infrastructure sector. &lt;/p&gt;&lt;p&gt;Key Competencies:&lt;/p&gt;&lt;p&gt;Aquatic ecosystems and water-quality monitoring &lt;/p&gt;&lt;p&gt;Environmental material safety &lt;/p&gt;&lt;p&gt;E-waste, EPR and end-of-life governance &lt;/p&gt;&lt;p&gt;Incident investigation and Root Cause Analysis &lt;/p&gt;&lt;p&gt;Safety auditing and emergency-response planning &lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Working Relationships :&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Work closely with client, internal PMU colleagues and relevant state, utility, financial, vendor or technology stakeholders. &lt;/p&gt;&lt;p&gt;Maintain role-specific work plans, action trackers, deliverable calendars and supporting records. &lt;/p&gt;&lt;p&gt;Produce clear, accurate and decision-ready outputs within agreed timelines and quality standards. &lt;/p&gt;&lt;p&gt;Handle programme, beneficiary, financial, portal and stakeholder information confidentially and follow approved access and information-security requirements. &lt;/p&gt;&lt;p&gt;Undertake field travel and support urgent programme reviews when required by the assignment. &lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;span style=\"color:#242424\"&gt;&lt;span&gt;&lt;b&gt;&lt;u&gt;Bot and Third-Party Applications&lt;/u&gt;&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#242424\"&gt;&lt;span&gt;Please note that this application must be submitted directly by the applicant for consideration. &lt;/span&gt;&lt;/span&gt;&lt;span style=\"color:#002451\"&gt;&lt;span&gt;Failure to do so may result in the application being excluded for consideration&lt;/span&gt;&lt;/span&gt;&lt;span style=\"color:#00b050\"&gt;&lt;span&gt;.  &lt;/span&gt;&lt;/span&gt;&lt;span&gt;Applicants needing an accommodation for disability or religious purposes in connection with the application process should contact &lt;/span&gt;&lt;a target=\"_blank\" href=\"mailto:Candidateaccommodation&#64;icf.com\"&gt;&lt;span style=\"color:#467886\"&gt;&lt;span&gt;&lt;u&gt;Candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;span&gt; for assistance.&lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;u&gt;&lt;b&gt;Working at ICF&lt;/b&gt;&lt;/u&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;ICF is a global advisory and technology services provider, but we’re not your typical consultants. We combine unmatched expertise with cutting-edge technology to help clients solve their most complex challenges, navigate change, and shape the future.&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;div&gt;&lt;b&gt;&lt;u&gt;Candidate AI Usage Policy&lt;/u&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;p&gt;&lt;span&gt;At ICF, we are committed to ensuring a fair and equitable interview process for all candidates based on their own skills and knowledge. As part of this commitment, the use of artificial intelligence (AI) tools to generate or assist with responses during interviews (whether in-person or virtual) is not permitted. This policy is in place to maintain the integrity and authenticity of the interview process. &lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;p&gt;&lt;span&gt;However, we understand that some candidates may require accommodations that involve the use of AI. If such an accommodation is needed, candidates are instructed to contact us in advance at&lt;span&gt; &lt;/span&gt;&lt;/span&gt;&lt;a href=\"mailto:candidateaccommodation&#64;icf.com\" target=\"_blank\"&gt;&lt;span&gt;candidateaccommodation&#64;icf.com&lt;/span&gt;&lt;/a&gt;&lt;span&gt;. We are dedicated to providing the necessary support to ensure that all candidates have an equal opportunity to succeed. &lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;br /&gt; &lt;/p&gt;New Delhi Client Office (II88)","title":"Environment and Safety Officer","datePosted":"2026-10-02","@context":"http://schema.org","occupationalCategory":"Consulting","directApply":false}</script>
