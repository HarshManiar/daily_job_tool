<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"IIIIIIUS","value":"R2603782"},"hiringOrganization":{"@type":"Organization","name":"IIIIIIUS","sameAs":"https://careers.icf.com/us/en","url":"https://careers.icf.com/us/en/job/R2603782/Platform-Enablement-Engineer","logo":null},"jobLocation":[{"geo":{"@type":"GeoCoordinates","latitude":"38.96872","longitude":"-77.3411"},"address":{"@type":"PostalAddress","postalCode":"20190","addressCountry":"United States of America","addressLocality":"Reston","addressRegion":"Virginia"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"4.9E-324","longitude":"4.9E-324"},"address":{"@type":"PostalAddress","postalCode":"36116","addressCountry":"United States of America","addressLocality":"Montgomery","addressRegion":"Alabama"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"35.22709","longitude":"-80.84313"},"address":{"@type":"PostalAddress","postalCode":"28201","addressCountry":"United States of America","addressLocality":"Charlotte","addressRegion":"North Carolina"},"@type":"Place"}],"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;Description&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;i&gt;Please note: This role is contingent upon a contract award. While it is not an immediate opening, we are actively conducting interviews and extending offers in anticipation of the award.&lt;/i&gt; &lt;/span&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#1f4e79\"&gt;&lt;b&gt;The Work &lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;At ICF our Digital Modernization Division is an information technology and management consulting organization that delivers integrated, strategic solutions to federal clients. We bring expertise in cloud, cybersecurity, enterprise architecture, data modernization, and digital transforamation to support mission-critical government programs.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;Join a team accelerating the modernization of a large federal agency&#39;s enterprise data and analytics ecosystem. This cloud-based platform provides data storage, analytics, governance, and AI/ML capabilities that enable thousands of users to transform data into actionable insights. As demand continues to grow, the team is focused on migrating legacy workloads, streamlining onboarding and support, expanding platform capabilities, and helping organizations across the enterprise adopt modern data and AI solutions at scale. &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;We are seeking a Platform Enablement Engineer to help customer teams successfully adopt their new cloud data platform. You’ll provide hands-on support across workspaces, access, data and analytics workflows, and AI/ML capabilities, helping customers move quickly from provisioning to productive use. You’ll troubleshoot technical issues, demonstrate platform capabilities, support onboarding and training, and coordinate with Platform, Data, Governance, AI/ML, and Security teams to resolve customer barriers. &lt;/span&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Job Location: &lt;/b&gt;Remote, however, strong preference for candidates who live in the Washington DC Metro Area. There will be occasional onsite meetings on the client site in Washington, DC. &lt;/span&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;i&gt;*If you accept this position, you should note that ICF does monitor employee work locations, blocks access from foreign locations/foreign IP addresses, and prohibits personal VPN connections.&lt;/i&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#1f4e79\"&gt;&lt;b&gt;What You Will Do: &lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Provide hands-on technical support for customer workspaces, tooling, access, and governed data use.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Guide customer teams through analytics workflows and cloud/data platform capabilities.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Support AI/ML onboarding and help customers transition from initial provisioning to productive platform use.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Troubleshoot technical barriers involving tooling, access, data, analytics workflows, and platform adoption.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Demonstrate platform capabilities directly to customer teams and explain how available tools support their workflows.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Deliver training support that helps customers build confidence and adopt platform capabilities effectively.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Coordinate technical escalations with Platform, Data, Governance, AI/ML, and Security teams.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Capture recurring issues, solutions, and reusable lessons to strengthen training and documentation.  &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;•  Support customer adoption by connecting technical problem-solving with practical use of cloud, data, analytics, and AI capabilities. &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#1f4e79\"&gt;&lt;b&gt;Basic Qualifications &lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;U.S. Citizenship is required due to federal contract requirements. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Candidate must reside in the U.S., be authorized to work in the U.S., and all work must be performed in the U.S. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Candidate must have lived in the U.S. for three (3) full years out of the last five (5) years. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Bachelor&#39;s degree in Data Management, Information Systems, Data Governance, Business Analytics, Computer Science, Library/Information Science, or related field; or a high school diploma with four (4) additional years of relevant experience in lieu of a bachelor&#39;s degree. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Minimum 3 years of relevant experience providing customer-facing technical support and troubleshooting. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Master&#39;s degree may substitute for two (2) years of relevant experience. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Preferred Qualifications&lt;/b&gt; &lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience supporting cloud-based data and analytics platforms, including Azure and Databricks environments. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience troubleshooting workspace configuration, user access, permissions, data access, and technical workflows. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience supporting analytics, data engineering, and AI/ML use cases and helping users adopt platform capabilities. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience delivering technical demonstrations, onboarding, training, and hands-on customer enablement. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Familiarity with data governance, security, and access controls in enterprise cloud environments. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Ability to troubleshoot across platform components and effectively coordinate issues with Platform, Data, AI/ML, Governance, and Security teams. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#1f4e79\"&gt;&lt;b&gt;Professional Skills: &lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Highly effective analytical, problem-solving, and decision-making capabilities. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Excellent written and verbal communication skills, with the ability to work effectively across technical and non-technical audiences. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Strong organization, attention to detail, and the ability to prioritize and manage multiple responsibilities. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Collaborative approach with a commitment to quality, accountability, and continuous improvement. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;  Experience supporting governed data use and working within data governance requirements. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience onboarding users or teams to AI/ML workflows or capabilities. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience coordinating escalations across Platform, Data, Governance, AI/ML, and Security stakeholders. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience converting troubleshooting insights and customer feedback into reusable documentation or training materials. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;span&gt;&lt;/span&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;#LI-CC1&lt;/b&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;#Indeed&lt;/b&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;u&gt;&lt;b&gt;Working at ICF&lt;/b&gt;&lt;/u&gt;&lt;/p&gt;ICF is a global advisory and technology services provider, but we’re not your typical consultants. We combine unmatched expertise with cutting-edge technology to help clients solve their most complex challenges, navigate change, and shape the future.&lt;br /&gt;&lt;p&gt;We can only solve the world&#39;s toughest challenges by building a workplace that allows everyone to thrive. We are an equal opportunity employer. Together, our employees are empowered to share their expertise and collaborate with others to achieve personal and professional goals. For more information, please read our &lt;a target=\"_blank\" href=\"https://www.icf.com/legal/equal-employment-opportunity\"&gt;&lt;u&gt;EEO&lt;/u&gt;&lt;/a&gt; policy.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;We will consider for employment qualified applicants with arrest and conviction records.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;&lt;u&gt;Work Authorization and Sponsorship&lt;/u&gt; &lt;/b&gt;&lt;/p&gt;&lt;p&gt;All candidates must be authorized to work in the United States. This position is not eligible for new H-1B visa sponsorship by ICF. Candidates who currently hold valid work authorization may be considered for a change of employer petition, subject to company policy and applicable immigration requirements.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;u&gt;Reasonable Accommodations&lt;/u&gt;&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Reasonable Accommodations are available, including, but not limited to, for disabled veterans, individuals with disabilities, and individuals with sincerely held religious beliefs, in all phases of the application and employment process. To request an accommodation, please email &lt;a target=\"_blank\" href=\"mailto:Candidateaccommodation&#64;icf.com\"&gt;&lt;u&gt;Candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/a&gt; and we will be happy to assist. All information you provide will be kept confidential and will be used only to the extent required to provide needed reasonable accommodations.  &lt;/p&gt;&lt;br /&gt;&lt;p&gt;Read more about &lt;a target=\"_blank\" href=\"https://www.eeoc.gov/sites/default/files/2022-10/EEOC_KnowYourRights_screen_reader_10_20.pdf\"&gt;&lt;u&gt;workplace discrimination rights&lt;/u&gt;&lt;/a&gt; or our benefit offerings which are included in the &lt;a target=\"_blank\" href=\"https://www.icf.com/legal/equal-employment-opportunity\"&gt;&lt;u&gt;Transparency in (Benefits) Coverage Act.&lt;/u&gt;&lt;/a&gt; &lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;span style=\"color:#242424\"&gt;&lt;b&gt;&lt;u&gt;Bot and Third-Party Applications&lt;/u&gt;&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#242424\"&gt;Please note that this application must be submitted directly by the applicant for consideration. &lt;/span&gt;&lt;span style=\"color:#002451\"&gt;Failure to do so may result in the application being excluded for consideration&lt;/span&gt;&lt;span style=\"color:#00b050\"&gt;.  &lt;/span&gt;Applicants needing an accommodation for disability or religious purposes in connection with the application process should contact &lt;a target=\"_blank\" href=\"mailto:Candidateaccommodation&#64;icf.com\"&gt;&lt;span style=\"color:#467886\"&gt;&lt;u&gt;Candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/span&gt;&lt;/a&gt; for assistance.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;u&gt;Candidate AI Usage Policy&lt;/u&gt;&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;At ICF, we are committed to ensuring a fair interview process for all candidates based on their own skills and knowledge. As part of this commitment, the use of artificial intelligence (AI) tools to generate or assist with responses during interviews (whether in-person or virtual) is not permitted. This policy is in place to maintain the integrity and authenticity of the interview process.  &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;However, we understand that some candidates may require accommodation that involves the use of AI. If such an accommodation is needed, candidates are instructed to contact us in advance at &lt;a target=\"_blank\" href=\"mailto:candidateaccommodation&#64;icf.com\"&gt;&lt;u&gt;candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/a&gt;. We are dedicated to providing the necessary support to ensure that all candidates have an equal opportunity to succeed.  &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;&lt;b&gt;&lt;u&gt;Pay Range&lt;/u&gt;&lt;/b&gt;&lt;u&gt; &lt;/u&gt;&lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;There are multiple factors that are considered in determining final pay for a position, including, but not limited to, relevant work experience, skills, certifications and competencies that align to the specified role, geographic location, education and certifications as well as contract provisions regarding labor categories that are specific to the position. &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;The pay range for this position based on full-time employment is:&lt;/p&gt;$61,232.00 - $104,094.00&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;Nationwide Remote Office (US99)","title":"Platform Enablement Engineer","datePosted":"2026-11-10","@context":"http://schema.org","occupationalCategory":"Program/Project","directApply":false}</script>
