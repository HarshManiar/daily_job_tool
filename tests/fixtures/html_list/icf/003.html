<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"IIIIIIUS","value":"R2603727"},"hiringOrganization":{"@type":"Organization","name":"IIIIIIUS","sameAs":"https://careers.icf.com/us/en","url":"https://careers.icf.com/us/en/job/R2603727/Program-Manager-Commercial-and-Industrial-Energy-Efficiency","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"34.00071","longitude":"-81.03481"},"address":{"@type":"PostalAddress","postalCode":"29033","addressCountry":"United States of America","addressLocality":"Columbia","addressRegion":"South Carolina"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;Description&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Program Manager – Commercial and Industrial Energy Efficiency&lt;/b&gt; &lt;br /&gt;&lt;b&gt;Location: Myrtle Beach, SC &lt;/b&gt; (or surrounding area) &lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#000000\"&gt;&lt;br /&gt;To support our growth, we are currently seeking a &lt;b&gt;Commercial and Industrial (C&amp;I) Energy Efficiency Program Manager &lt;/b&gt;for our Utility Programs and Services (UPS) division to support work in South Carolina. Based in the Myrtle Beach area, you will help lead the development and management of the C&amp;I energy efficiency program, build relationships with clients and commercial and industrial customers, mentor junior team members, and design/implement program strategies and plans. This position will interface with staff, clients, and program stakeholders locally in the Myrtle Beach area and throughout the utility’s South Carolina service territory. &lt;/span&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Why you will love working here:&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Quality of life:  &lt;/b&gt;Flexible workplace arrangements, work-life balance, employee wellbeing programs&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Investment of the community: &lt;/b&gt;Donation matching, volunteer opportunities&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Investment in you:&lt;/b&gt; Education Reimbursement, Retirement Planning, 401k matching, Mentorship Programs, Free access to professional development resources such LinkedIn Learning&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;Any many, many more &lt;/b&gt;&lt;i&gt;*Ask your recruiter for more details!&lt;/i&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt; &lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;What you will be doing:&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Implement the Commercial and Industrial energy efficiency program through detailed management plans, quality control, and evaluation processes&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Supervise direct reports, providing guidance and support to ensure success&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Collaborate with cross-functional teams of technical and marketing specialists (internal staff and subcontractors) to meet program goals&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Build and maintain strategic partnerships with commercial and industrial customers, contractors, and trade allies through in-person and virtual engagement&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Assist with program forecasts, budgets, and goals&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Analyze market trends and technologies to enhance program performance&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;What we need you to have (minimum qualifications):&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Bachelor’s degree in Business, Environmental Science, Engineering, Energy Management, Sustainability, or related discipline (or applicants can substitute one year of related experience for one year of education) &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;3&#43; years of experience developing designing and administering successful energy efficiency and demand reduction programs for utilities, state energy offices, state/local governments, and/or regional non-profits and/or related experience&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Valid driver’s license required&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Must be able to successfully pass a Motor Vehicle Records (MVR) check and drug screening.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br /&gt;&lt;span style=\"color:#000000\"&gt;&lt;b&gt;What we would like you to have (preferred qualifications):&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Experience with the commercial and industrial energy efficiency market in South Carolina&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Knowledge of sustainable building practices and technologies  &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Ability to manage client relationships and communicate effectively &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Previous experience managing junior staff &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Ability to work independently in a fast-paced environment while maintaining multiple deadlines&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br /&gt;&lt;b&gt;&lt;u&gt;Compensation&lt;/u&gt;&lt;/b&gt;: &lt;b&gt;Although the posted range below is broader, this position is anticipated to offer a base salary in the &lt;/b&gt;&lt;span&gt;&lt;b&gt;$85,000-$95,000&lt;/b&gt;&lt;/span&gt;&lt;b&gt; range. Actual compensation may vary based on the candidate’s location, experience, and other relevant factors.&lt;/b&gt;&lt;br /&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;u&gt;&lt;b&gt;Working at ICF&lt;/b&gt;&lt;/u&gt;&lt;/p&gt;ICF is a global advisory and technology services provider, but we’re not your typical consultants. We combine unmatched expertise with cutting-edge technology to help clients solve their most complex challenges, navigate change, and shape the future.&lt;br /&gt;&lt;p&gt;We can only solve the world&#39;s toughest challenges by building a workplace that allows everyone to thrive. We are an equal opportunity employer. Together, our employees are empowered to share their expertise and collaborate with others to achieve personal and professional goals. For more information, please read our &lt;a target=\"_blank\" href=\"https://www.icf.com/legal/equal-employment-opportunity\"&gt;&lt;u&gt;EEO&lt;/u&gt;&lt;/a&gt; policy.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;We will consider for employment qualified applicants with arrest and conviction records.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;&lt;u&gt;Work Authorization and Sponsorship&lt;/u&gt; &lt;/b&gt;&lt;/p&gt;&lt;p&gt;All candidates must be authorized to work in the United States. This position is not eligible for new H-1B visa sponsorship by ICF. Candidates who currently hold valid work authorization may be considered for a change of employer petition, subject to company policy and applicable immigration requirements.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;u&gt;Reasonable Accommodations&lt;/u&gt;&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Reasonable Accommodations are available, including, but not limited to, for disabled veterans, individuals with disabilities, and individuals with sincerely held religious beliefs, in all phases of the application and employment process. To request an accommodation, please email &lt;a target=\"_blank\" href=\"mailto:Candidateaccommodation&#64;icf.com\"&gt;&lt;u&gt;Candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/a&gt; and we will be happy to assist. All information you provide will be kept confidential and will be used only to the extent required to provide needed reasonable accommodations.  &lt;/p&gt;&lt;br /&gt;&lt;p&gt;Read more about &lt;a target=\"_blank\" href=\"https://www.eeoc.gov/sites/default/files/2022-10/EEOC_KnowYourRights_screen_reader_10_20.pdf\"&gt;&lt;u&gt;workplace discrimination rights&lt;/u&gt;&lt;/a&gt; or our benefit offerings which are included in the &lt;a target=\"_blank\" href=\"https://www.icf.com/legal/equal-employment-opportunity\"&gt;&lt;u&gt;Transparency in (Benefits) Coverage Act.&lt;/u&gt;&lt;/a&gt; &lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;span style=\"color:#242424\"&gt;&lt;b&gt;&lt;u&gt;Bot and Third-Party Applications&lt;/u&gt;&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#242424\"&gt;Please note that this application must be submitted directly by the applicant for consideration. &lt;/span&gt;&lt;span style=\"color:#002451\"&gt;Failure to do so may result in the application being excluded for consideration&lt;/span&gt;&lt;span style=\"color:#00b050\"&gt;.  &lt;/span&gt;Applicants needing an accommodation for disability or religious purposes in connection with the application process should contact &lt;a target=\"_blank\" href=\"mailto:Candidateaccommodation&#64;icf.com\"&gt;&lt;span style=\"color:#467886\"&gt;&lt;u&gt;Candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/span&gt;&lt;/a&gt; for assistance.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;u&gt;Candidate AI Usage Policy&lt;/u&gt;&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;At ICF, we are committed to ensuring a fair interview process for all candidates based on their own skills and knowledge. As part of this commitment, the use of artificial intelligence (AI) tools to generate or assist with responses during interviews (whether in-person or virtual) is not permitted. This policy is in place to maintain the integrity and authenticity of the interview process.  &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;However, we understand that some candidates may require accommodation that involves the use of AI. If such an accommodation is needed, candidates are instructed to contact us in advance at &lt;a target=\"_blank\" href=\"mailto:candidateaccommodation&#64;icf.com\"&gt;&lt;u&gt;candidateaccommodation&#64;icf.com&lt;/u&gt;&lt;/a&gt;. We are dedicated to providing the necessary support to ensure that all candidates have an equal opportunity to succeed.  &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;&lt;b&gt;&lt;u&gt;Pay Range&lt;/u&gt;&lt;/b&gt;&lt;u&gt; &lt;/u&gt;&lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;There are multiple factors that are considered in determining final pay for a position, including, but not limited to, relevant work experience, skills, certifications and competencies that align to the specified role, geographic location, education and certifications as well as contract provisions regarding labor categories that are specific to the position. &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;The pay range for this position based on full-time employment is:&lt;/p&gt;$73,738.00 - $125,354.00&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;S Carolina Remote Office (SC99)","title":"Program Manager – Commercial and Industrial Energy Efficiency","datePosted":"2026-11-13","@context":"http://schema.org","occupationalCategory":"Program/Project","directApply":false}</script>
