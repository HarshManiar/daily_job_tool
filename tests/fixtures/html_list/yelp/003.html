<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Yelp","value":"14083"},"hiringOrganization":{"@type":"Organization","name":"Yelp","sameAs":"https://www.yelp.careers/us/en","url":"https://www.yelp.careers/us/en/job/14083/Senior-Growth-Marketing-Manager-Consumer","logo":"https://assets.phenompeople.com/CareerConnectResources/prod/YELPUS/images/job_logo_config--1683910402532.png"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"4.9E-324","longitude":"4.9E-324"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Remote","addressRegion":"Remote"},"@type":"Place"},"employmentType":["OTHER","FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;h2&gt;Summary&lt;/h2&gt;&lt;p style=\"margin: 0px;\"&gt;Yelp's mission is to connect people with great local businesses. As a trusted source of information on local business, millions of people turn to Yelp every day to make decisions about where to spend their money &mdash; from where to eat, shop or stay, to which home or local service provider to use, and beyond.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;Yelp's Growth Marketing team drives user acquisition, activation and long-term engagement across the full consumer lifecycle. As a Senior Growth Marketing Manager, you will lead strategy and hands-on execution to deepen engagement with our existing users across our Services and Restaurants, Food &amp; Nightlife (RFN) verticals, and to build awareness of Yelp as the go-to destination for home and local services.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;You will own campaigns across Yelp's owned channels (i.e., email, push, in-product placements) as well as paid and organic social, with the goal of inspiring consumers, capturing intent and converting it to action. We are looking for a growth marketer who is also a strong creative leader: someone who keeps a pulse on culture, brings timely trends into our marketing, and turns Yelp's authentic user-generated content into scroll-stopping creative that delivers measurable results.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;In this highly cross-functional role, you will partner closely with Creative, Social, Paid Media, Product Marketing, Marketing Operations and Technology, Growth Science, Product and Engineering to plan, launch and optimize campaigns that drive engagement, reach and revenue growth.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;Our team is passionate about data, experimentation and the power of new technology, including AI, to drive innovation. We are especially interested in candidates who bring direct experience with engagement and growth marketing at scale, and who bring curiosity and enthusiasm for using AI and emerging technologies to advance marketing effectiveness.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;We&rsquo;d love to have you apply, even if you don&rsquo;t feel you meet every single requirement in this posting. At Yelp, we&rsquo;re looking for great people, not just those who simply check off all the boxes. This is a full-time remote role based in the United States.&lt;/p&gt;&lt;br&gt;&lt;h2&gt;What you'll do:&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Lead consumer engagement and growth strategy&lt;/strong&gt; to inspire ongoing engagement with existing users across Services and RFN, while building awareness and consideration of Yelp as the go-to destination for home and local services.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Own the campaign calendar across owned channels&lt;/strong&gt; (i.e., email, push, in-product) for Services and RFN, including seasonal, thematic and always-on programs, and experiment with new messaging, creative and targeting to drive engagement and conversion.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Drive Services awareness through paid and organic social&lt;/strong&gt;, partnering with the Social and Paid Media teams to develop channel-native content and campaigns across platforms such as Instagram, TikTok, YouTube, Facebook, Pinterest and Reddit, and evaluate new upper-funnel channels as opportunities emerge.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Serve as a creative leader for consumer growth campaigns&lt;/strong&gt;, setting the creative vision and partnering with in-house design and production teams to build thumb-stopping creative and reusable creative systems the broader team can scale.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Move quickly on cultural moments&lt;/strong&gt; by tracking emerging trends and platform-native formats, and turning them into timely, on-brand campaigns that drive user engagement.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Turn Yelp's user-generated content into marketing&lt;/strong&gt;, using reviews, photos, videos and community voices to build authentic, trust-driving creative across channels.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Partner with Product and Product Marketing&lt;/strong&gt; to bring new product launches, brand positioning and personalized discovery experiences to life.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Lead the development, execution, measurement and optimization of growth experiments&lt;/strong&gt; using A/B testing, creative testing, segmentation and analytics.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Use AI tools and emerging technologies&lt;/strong&gt; to enhance consumer insights, accelerate creative development, improve marketing workflows and boost campaign effectiveness.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;h2&gt;What it takes to succeed:&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;7-10 years of experience in growth or lifecycle marketing with a focus on driving engagement among existing users, plus experience driving awareness and consideration.&lt;/li&gt;&lt;li&gt;Proven experience building and scaling growth campaigns across owned channels (i.e., email, push, in-product placements) that drive measurable business impact.&lt;/li&gt;&lt;li&gt;Hands-on experience with marketing platforms (i.e., Braze) for campaign execution and audience segmentation.&lt;/li&gt;&lt;li&gt;Hands-on experience with paid and organic social marketing, including channel-native content strategy, creator or UGC-driven creative and platform best practices.&lt;/li&gt;&lt;li&gt;A strong creative eye and demonstrated experience leading creative development from brief to launch, with a portfolio of campaigns that broke through.&lt;/li&gt;&lt;li&gt;Deep understanding of internet culture, social trends and consumer behavior, with the ability to act quickly on cultural moments while protecting brand trust.&lt;/li&gt;&lt;li&gt;Experience integrating user-generated content and community voices into marketing campaigns.&lt;/li&gt;&lt;li&gt;Strong analytical skills, including measuring the business impact of engagement and upper-funnel marketing, analyzing performance across a portfolio of campaigns and turning insights into continuous optimization.&lt;/li&gt;&lt;li&gt;Excellent organizational, project management, cross-functional collaboration and prioritization skills, with the ability to work independently in a fast-paced, changing environment.&lt;/li&gt;&lt;li&gt;Strong communication and storytelling skills, with the ability to summarize complex concepts for an executive audience.&lt;/li&gt;&lt;li&gt;Curiosity and enthusiasm for applying AI in growth marketing and creative development.&lt;/li&gt;&lt;li&gt;Bachelor's degree in Marketing, Business, Communications or a related field, or equivalent practical experience.&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"margin: 0px;\"&gt;&lt;span style=\"font-size: 12pt;\"&gt;&lt;strong&gt;Nice to Have:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Ability to self-generate high-quality creative (i.e., using design or AI tools) without relying on Creative teams for every asset.&lt;/li&gt;&lt;li&gt;Hands-on experience applying AI solutions in growth marketing workflows.&lt;/li&gt;&lt;li&gt;Experience in a two-sided marketplace, consumer tech or local services category.&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;br&gt;&lt;h2&gt;What you'll get:&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Effective your first day: Full medical, vision, and dental&nbsp;&lt;/li&gt;&lt;li&gt;15 days PTO (accrual begins on date of hire and increases with 2+ years of tenure thereafter), 12 paid holidays, plus one floating holiday&lt;/li&gt;&lt;li&gt;Up to 14 weeks of parental leave&lt;/li&gt;&lt;li&gt;Monthly wellness subsidy&lt;/li&gt;&lt;li&gt;Work from home reimbursement&lt;/li&gt;&lt;li&gt;Flexible spending account&lt;/li&gt;&lt;li&gt;401(k) retirement savings plan&lt;/li&gt;&lt;li&gt;Employee stock purchase plan&lt;/li&gt;&lt;li&gt;Compensation range for this position is $126,000 - $216,000 annually. You may also be offered a bonus and benefits.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;h2&gt;Closing&lt;/h2&gt;&lt;div&gt;&lt;em&gt;At Yelp, we believe that diversity is an expression of all the unique characteristics that make us human: race, age, sexual orientation, gender identity, religion, disability, and education &mdash; and those are just a few. We recognize that diverse backgrounds and perspectives strengthen our teams and our product. The foundation of our diversity efforts are closely tied to our core values, which include &ldquo;Playing Well With Others&rdquo; and &ldquo;Authenticity.&rdquo;&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We&rsquo;re proud to be an equal opportunity employer and consider qualified applicants without regard to race, color, religion, sex, national origin, ancestry, age, genetic information, sexual orientation, gender identity, marital or family status, veteran status, medical condition or disability.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Actual salary offered may vary based on multiple factors, including but not limited to, an individual's location and experience.&nbsp;&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We will consider for employment qualified candidates with arrest and conviction records, consistent with applicable law (including, for example, the San Francisco Fair Chance Ordinance for roles based in San Francisco, the Los Angeles County Fair Chance Ordinance for roles based in the unincorporated areas of Los Angeles County, and the California Fair Chance Act for roles based in California).&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Where required by law, a criminal background check will not be conducted until after a conditional offer of employment is made, and any evaluation of a candidate's criminal background check will be subject to an individualized assessment that takes into account the candidate's specific criminal records and the responsibilities and requirements of the particular role.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We are committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, you may contact us at accommodations-recruiting@yelp.com or 415-969-8488.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Note: Yelp does not accept agency resumes. Please do not forward resumes to any recruiting alias or employee. Yelp is not responsible for any fees related to unsolicited resumes.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://docs.google.com/document/d/e/2PACX-1vSiQ5ajIdwoMv07VjFKWB71xJJU-yzWOgQkZLRngmFFhquutnmdihX5_E9lY0Qq6m7VSTNQfeO_tMKK/pub\" target=\"_blank\" rel=\"noopener\"&gt;US Recruiting and Applicant Privacy Notice&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://docs.google.com/document/d/e/2PACX-1vTGyXsWXm4zjJFrUhtqagO8G9c5QWvBd4BaE5_tfP5SC0AA0McQLFMgOQjzAWOXWw7vIbXvJRJzYSoG/pub?urp=gmail_link\" target=\"_blank\" title=\"Washington State Fair Chance Act\" rel=\"noopener\"&gt;Notice to Washington Applicants - Washington State Fair Chance Act&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;#LI-Remote&lt;/div&gt;","title":"Senior Growth Marketing Manager, Consumer","datePosted":"2026-11-07","@context":"http://schema.org","occupationalCategory":"Marketing","directApply":false}</script>
