{"geo":{"@type":"GeoCoordinates","latitude":"35.60095","longitude":"-82.55402"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Asheville","addressRegion":"North Carolina"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"42.88645","longitude":"-78.87837"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Buffalo","addressRegion":"New York"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"32.77632","longitude":"-79.93275"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Charleston","addressRegion":"South Carolina"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"29.65163","longitude":"-82.32483"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Gainesville","addressRegion":"Florida"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"26.12231","longitude":"-80.14338"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Fort Lauderdale","addressRegion":"Florida"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"42.33143","longitude":"-83.04575"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Detroit","addressRegion":"Michigan"},"@type":"Place"}],"employmentType":["OTHER","FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;h2&gt;Summary&lt;/h2&gt;&lt;p style=\"margin: 0px;\"&gt;&lt;strong&gt;&lt;em&gt;*Please note that while this role will operate remotely, it is required that the candidate resides in the Eastern Region of the United States. This includes candidates residing in Eastern Time Zone.&nbsp;&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;Yelp was created to connect people with great local businesses. As an Inside Sales Representative, you&rsquo;ll work with small business owners over the phone to help them achieve their goals through Yelp&rsquo;s advertising programs. By understanding their unique needs, you'll provide tailored solutions that drive results. Ultimately, we succeed when our clients grow.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;People are at the center of everything we do. In this role, you will be directly responsible for doing outreach and educating business owners across the US and Canada on our advertising solutions. Success is measured by hitting and exceeding a monthly quota, consistently staying ahead of daily metrics, and handling rejection in stride. You&rsquo;ll experience all of this within a highly supportive, virtual team environment.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;Please visit &lt;a href=\"https://www.yelp.com/careers\" target=\"_blank\" rel=\"noopener\"&gt;www.yelp.com/careers&lt;/a&gt; and apply to the appropriate posting that matches your location.&lt;/p&gt;&lt;br&gt;&lt;h2&gt;What you'll do:&lt;/h2&gt;&lt;ul&gt;&lt;li style=\"list-style-type: none;\"&gt;&lt;ul&gt;&lt;li&gt;Educate, strategize, and successfully discuss Yelp advertising programs through a high volume of outbound dialing to business owners. &nbsp;- This role is 100% phone based and fast-paced by nature.&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You'll work one of the following schedules (in your local time), or as otherwise determined by your manager: 7:30 a.m. to 4:30 p.m.; 8:30 a.m. to 5:30 p.m.; or 9:30 a.m. to 6:30 p.m.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;Own and manage a pipeline of clients ranging from dentists to florists to restaurant owners- all organized in our CRM (Salesforce).&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;Say goodbye to that dreaded commute! You and your team will work from the comfort of your home to sell advertising to small local businesses on a set Monday to Friday schedule.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;Become an expert in Yelp&rsquo;s advertising solutions, and provide product recommendations quickly to suit client needs -&nbsp; asking probing questions, overcoming customer objections and rejection will be critical to your success.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You&rsquo;ll master quick close techniques to exceed individual goals.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;Successfully navigate the initial call to qualification to close process, ensuring lasting customer satisfaction and potential upsell opportunities.&nbsp;&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;Achieve and consistently exceed monthly quotas - strong work ethic and tenacity are key!&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;Track and manage your daily goals to ensure results are met. It is a numbers game and you&rsquo;re here to win.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;br&gt;&lt;h2&gt;What it takes to succeed:&lt;/h2&gt;&lt;ul&gt;&lt;li dir=\"ltr\" role=\"presentation\"&gt;GED/HS Diploma and 2+ years of customer-facing experience OR;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;Bachelor&rsquo;s Degree with a demonstrated interest in sales/business or people-centric industry (e.g. coursework, internships, clubs, or extracurricular activities)&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;No fear of the phone and prepared to make a high volume of outbound dials, daily&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;General computer and email proficiency - we use Google Suite and provide a Macbook laptop&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;A work environment free of distractions&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;You will need access to an individual hardline high-speed internet connection in your workspace. This job cannot be performed using satellite internet or a mobile hotspot.&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;Open to feedback and willing to implement for areas of improvement&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;Strong, engaging interpersonal skills&nbsp;&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;Ability to effectively prioritize tasks and manage independently without oversight&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;Must possess current US work authorization&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;h2&gt;What you'll get:&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;The starting base salary for this role is $37k annually&lt;/li&gt;&lt;li&gt;This role is also eligible to earn uncapped commission&lt;/li&gt;&lt;li&gt;Average year 1 on target annual compensation for this role is around $50k, which includes base salary and commission assuming minimum performance expectations are met.&lt;/li&gt;&lt;li&gt;Top performers have the opportunity to significantly exceed target earnings.&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;Available your first day: Full medical, vision, and dental&nbsp;&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;15 days PTO per year for first 2 years of employment (accrual begins on date of hire); number of PTO days increases after 2 years of tenure, 7 paid wellness days, 12 paid holidays, 1 floating holiday&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;Up to 14 weeks of parental leave&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;Monthly wellness reimbursement&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;Health Savings, Flexible Spending and Dependent Care accounts&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;401(k) retirement savings plan with employer match&lt;/li&gt;&lt;li style=\"list-style-type: disc;\"&gt;Employee stock purchase plan&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;h2&gt;Closing&lt;/h2&gt;&lt;div&gt;&lt;em&gt;At Yelp, we believe that diversity is an expression of all the unique characteristics that make us human: race, age, sexual orientation, gender identity, religion, disability, and education &mdash; and those are just a few. We recognize that diverse backgrounds and perspectives strengthen our teams and our product. The foundation of our diversity efforts are closely tied to our core values, which include &ldquo;Playing Well With Others&rdquo; and &ldquo;Authenticity.&rdquo;&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We&rsquo;re proud to be an equal opportunity employer and consider qualified applicants without regard to race, color, religion, sex, national origin, ancestry, age, genetic information, sexual orientation, gender identity, marital or family status, veteran status, medical condition or disability.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Actual salary offered may vary based on multiple factors, including but not limited to, an individual's location and experience.&nbsp;&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We will consider for employment qualified candidates with arrest and conviction records, consistent with applicable law (including, for example, the San Francisco Fair Chance Ordinance for roles based in San Francisco, the Los Angeles County Fair Chance Ordinance for roles based in the unincorporated areas of Los Angeles County, and the California Fair Chance Act for roles based in California).&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Where required by law, a criminal background check will not be conducted until after a conditional offer of employment is made, and any evaluation of a candidate's criminal background check will be subject to an individualized assessment that takes into account the candidate's specific criminal records and the responsibilities and requirements of the particular role.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We are committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, you may contact us at accommodations-recruiting@yelp.com or 415-969-8488.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Note: Yelp does not accept agency resumes. Please do not forward resumes to any recruiting alias or employee. Yelp is not responsible for any fees related to unsolicited resumes.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://docs.google.com/document/d/e/2PACX-1vSiQ5ajIdwoMv07VjFKWB71xJJU-yzWOgQkZLRngmFFhquutnmdihX5_E9lY0Qq6m7VSTNQfeO_tMKK/pub\" target=\"_blank\" rel=\"noopener\"&gt;US Recruiting and Applicant Privacy Notice&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;a title=\"Washington State Fair Chance Act\" href=\"https://docs.google.com/document/d/e/2PACX-1vTGyXsWXm4zjJFrUhtqagO8G9c5QWvBd4BaE5_tfP5SC0AA0McQLFMgOQjzAWOXWw7vIbXvJRJzYSoG/pub?urp=gmail_link\" target=\"_blank\" rel=\"noopener\"&gt;Notice to Washington Applicants - Washington State Fair Chance Act&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;#LI-Remote #Circa&lt;/div&gt;","title":"Inside Sales Representative  (Remote - Eastern Region)","datePosted":"2026-10-16","@context":"http://schema.org","occupationalCategory":"Sales & Customer Success","directApply":false}</script>
