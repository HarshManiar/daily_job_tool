<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Yelp","value":"14069"},"hiringOrganization":{"@type":"Organization","name":"Yelp","sameAs":"https://www.yelp.careers/us/en","url":"https://www.yelp.careers/us/en/job/14069/Community-Manager-Orange-County-South","logo":"https://assets.phenompeople.com/CareerConnectResources/prod/YELPUS/images/job_logo_config--1683910402532.png"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"33.67691","longitude":"-117.77617"},"address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Orange County","addressRegion":"California"},"@type":"Place"},"employmentType":["OTHER","FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;h2&gt;Summary&lt;/h2&gt;&lt;p style=\"margin: 0px;\"&gt;Do you love southern Orange County? Are you the go-to person when it comes to planning a night out, always ready with a recommendation for the city&rsquo;s most seasoned finds and hidden hotspots?&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;As the Orange County South Community Manager, you will be a full-time Yelp employee (working out of your home or anywhere in your metro with WiFi) at the helm of a vibrant, buzzing community of locals who drink, shop, and play their way through the city via peer recommendations on Yelp.&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;The Community Manager role requires you to blend strong event planning, social media, and marketing skills with the goal of highlighting local businesses and further embedding the Yelp Elite Squad into the local community.&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&lt;strong&gt;&nbsp;&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;What is the Yelp Elite Squad, you ask? They are a group of Yelpers who have gone the extra mile with their content- think awesome photos, thoughtful reviews, complimenting others&rsquo; content, etc. In an effort to recognize these key contributors, we display &ldquo;Elite&rdquo; badges on their Yelp profile, and invite them to exclusive events with other locals that are put on by the Community team (aka you!).&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;br&gt;&lt;h2&gt;What you'll do:&lt;/h2&gt;&lt;ul&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will be the face of Yelp in your region by attending local events and building connections with local business owners.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will conceptualize, plan, and execute Yelp events in your region.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will forge mutually beneficial partnerships with local businesses who are willing to partner with Yelp and sponsor events.&nbsp;&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will support your Yelp Elite squad by answering questions, engaging with their content on Yelp, and keeping them up to date on the latest happenings in your city.&nbsp;&nbsp;&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will research and curate local business collections featuring the best of your city for the Local Yelp newsletter.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will build relationships and partnerships with local organizations with the goal of reaching new audiences.&nbsp;&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p role=\"presentation\" style=\"margin: 0px;\"&gt;You will manage the day-to-day curation and growth of Yelp&rsquo;s regional social media presence across Instagram, including copywriting and visual asset creation via Canva and/or video curation and editing.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;br&gt;&lt;h2&gt;What it takes to succeed:&lt;/h2&gt;&lt;ul&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You consider yourself a local expert on all things OC South!&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You have 3+ years of professional experience in event planning, social media management, and/or marketing.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You are willing to approach and connect with business owners to forge relationships and inspire collaboration on behalf of Yelp.&nbsp;&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You have strong written and verbal communication skills.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You thrive in an autonomous environment where you have control over your schedule&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You are energized by the idea of creative freedom&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;You have the ability to lift 10 pounds without assistance.&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;Bachelor's Degree (Preferred)&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&lt;strong&gt;Other Requirements:&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You live within &lt;strong&gt;southern &lt;/strong&gt;Orange County, in one of the following cities: Irvine, Tustin, Newport Beach, Corona Del Mar, Mission Viejo, Aliso Viejo, Lake Forest, Laguna Niguel, Laguna Beach, Laguna Hills, Ladera Ranch, Rancho Santa Margarita, Foothill Ranch, San Juan Capistrano, Dana Point, or San Clemente.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;You are at least 21 years of age and have reliable transportation options.&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\" role=\"presentation\"&gt;&lt;strong&gt;Please include a cover letter&lt;/strong&gt; outlining your interest in Yelp and why you are an ideal candidate. We&rsquo;d also like for you to share a recent local business you supported!&lt;/p&gt;&lt;/li&gt;&lt;li dir=\"ltr\" style=\"list-style-type: disc;\" aria-level=\"1\"&gt;&lt;p style=\"margin: 0px;\"&gt;We expect our Community Managers to be the biggest cheerleaders and role models for their local Yelp Elite Squad. As such, Community Managers must always meet the Elite Squad &lt;a href=\"https://www.yelp-support.com/article/How-do-I-join-the-Yelp-Elite-Squad?l=en_US\" target=\"_blank\" rel=\"noopener\" data-saferedirecturl=\"https://www.google.com/url?q=https://www.yelp-support.com/article/How-do-I-join-the-Yelp-Elite-Squad?l%3Den_US&amp;source=gmail&amp;ust=1755356937999000&amp;usg=AOvVaw1IrUNMx1eQZSm7uqEwhs9w\"&gt;eligibility requirements&lt;/a&gt;&nbsp;and comply with our&nbsp;&lt;a href=\"https://terms.yelp.com/elite/en_us/20231012_en_us/\" target=\"_blank\" rel=\"noopener\" data-saferedirecturl=\"https://www.google.com/url?q=https://terms.yelp.com/elite/en_us/20231012_en_us/&amp;source=gmail&amp;ust=1755356937999000&amp;usg=AOvVaw2Zcorc5RsZwpQ1bkq79MSy\"&gt;Elite Terms of Membership&lt;/a&gt;.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;Additionally, to maintain Yelp&rsquo;s integrity and avoid conflicts of interest, our Community Managers are prohibited from accepting any form of compensation in exchange for promoting a company&rsquo;s goods or services. This includes things like accepting free or discounted gym membership in exchange for promoting the gym on their personal social channels, attending a complimentary dinner in exchange for posting a review online of the restaurant that hosted the dinner and so on.&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;&nbsp;&lt;/p&gt;&lt;p style=\"margin: 0px;\"&gt;By submitting your application for this role, you represent that you have reviewed and understand the information above (including the information contained in the provided links) and will comply with these guidelines if offered the role at Yelp.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;h2&gt;What you'll get:&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Effective your first day: Full medical, vision, and dental&nbsp;&lt;/li&gt;&lt;li&gt;15 days PTO (accrual begins on date of hire and increases with 2+ years of tenure thereafter), 12 paid holidays, plus one floating holiday&lt;/li&gt;&lt;li&gt;Up to 14 weeks of parental leave&lt;/li&gt;&lt;li&gt;Monthly wellness subsidy&lt;/li&gt;&lt;li&gt;Work from home reimbursement&lt;/li&gt;&lt;li&gt;Flexible spending account&lt;/li&gt;&lt;li&gt;401(k) retirement savings plan&lt;/li&gt;&lt;li&gt;Employee stock purchase plan&lt;/li&gt;&lt;li&gt;Compensation range for this position is $67,000 - $90,000&nbsp;annually. You may also be offered a bonus and benefits.&lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;h2&gt;Closing&lt;/h2&gt;&lt;div&gt;&lt;em&gt;At Yelp, we believe that diversity is an expression of all the unique characteristics that make us human: race, age, sexual orientation, gender identity, religion, disability, and education &mdash; and those are just a few. We recognize that diverse backgrounds and perspectives strengthen our teams and our product. The foundation of our diversity efforts are closely tied to our core values, which include &ldquo;Playing Well With Others&rdquo; and &ldquo;Authenticity.&rdquo;&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We&rsquo;re proud to be an equal opportunity employer and consider qualified applicants without regard to race, color, religion, sex, national origin, ancestry, age, genetic information, sexual orientation, gender identity, marital or family status, veteran status, medical condition or disability.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Actual salary offered may vary based on multiple factors, including but not limited to, an individual's location and experience.&nbsp;&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We will consider for employment qualified candidates with arrest and conviction records, consistent with applicable law (including, for example, the San Francisco Fair Chance Ordinance for roles based in San Francisco, the Los Angeles County Fair Chance Ordinance for roles based in the unincorporated areas of Los Angeles County, and the California Fair Chance Act for roles based in California).&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Where required by law, a criminal background check will not be conducted until after a conditional offer of employment is made, and any evaluation of a candidate's criminal background check will be subject to an individualized assessment that takes into account the candidate's specific criminal records and the responsibilities and requirements of the particular role.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;We are committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, you may contact us at accommodations-recruiting@yelp.com or 415-969-8488.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;em&gt;Note: Yelp does not accept agency resumes. Please do not forward resumes to any recruiting alias or employee. Yelp is not responsible for any fees related to unsolicited resumes.&lt;/em&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://docs.google.com/document/d/e/2PACX-1vSiQ5ajIdwoMv07VjFKWB71xJJU-yzWOgQkZLRngmFFhquutnmdihX5_E9lY0Qq6m7VSTNQfeO_tMKK/pub\" target=\"_blank\" rel=\"noopener\"&gt;US Recruiting and Applicant Privacy Notice&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;&lt;a href=\"https://docs.google.com/document/d/e/2PACX-1vTGyXsWXm4zjJFrUhtqagO8G9c5QWvBd4BaE5_tfP5SC0AA0McQLFMgOQjzAWOXWw7vIbXvJRJzYSoG/pub?urp=gmail_link\" target=\"_blank\" title=\"Washington State Fair Chance Act\" rel=\"noopener\"&gt;Notice to Washington Applicants - Washington State Fair Chance Act&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&nbsp;&lt;/div&gt;&lt;div&gt;#LI-Remote&lt;/div&gt;","title":"Community Manager, Orange County (South)","datePosted":"2026-11-03","@context":"http://schema.org","occupationalCategory":"Community","directApply":false}</script>
