acing responses. &lt;br&gt;&lt;br&gt;The successful candidate will not be expected to serve as a hands-on infrastructure engineer; however, they must be technically fluent enough to challenge recovery assumptions, understand system dependencies, evaluate RTO/RPO feasibility, and translate complex recovery plans into practical business, executive, and client-facing language.&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;What You&#39;ll Do:&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Execute and support the Payments business continuity and disaster recovery operating model, including governance, roles and responsibilities, documentation standards, testing approach, evidence management, and issue remediation. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Support or coordinate the Payments Incident/Crisis Management response to significant disruptions, including escalation, communications, recovery, and return to normal operations. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Lead BU-specific initiatives to strengthen business continuity and disaster recovery capabilities, including cybersecurity resilience. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Partner with Product, Technology, Cybersecurity, Business Continuity, Compliance, Legal, Sales, and Client Management to clarify ownership and drive measurable progress against BC/DR priorities. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Own the Payments Business Impact Analysis: process criticality tiering, application and vendor dependency mapping, maximum tolerable downtime, and data loss tolerance. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Contribute to a prioritized Payments DR roadmap that addresses the most critical business processes, systems, vendors, banking dependencies, and client-facing commitments. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Coordinate planning for high-impact scenarios, including cyberattack, system lockout, application outage, data unavailability, bank connectivity disruption, vendor outage, severe weather, and other material disruptions to critical systems and data. &lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;span style=\"color:#000000\"&gt;Monitor local weather and other emerging threats and m&lt;/span&gt;&lt;span style=\"color:#242424\"&gt;aintain event-triggered readiness protocols for weather, utility, and regional disruption in coordination with enterprise crisis management.&lt;/span&gt; &lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;What You&#39;ll Bring to Zelis:&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Bachelor&#39;s degree in business, technology, risk management, information systems, or equivalent practical experience. &lt;/li&gt;&lt;li&gt;7&#43; years of experience in disaster recovery, technology risk, cybersecurity resilience, payments operations, technology program management, or a related field.&lt;/li&gt;&lt;li&gt;3&#43; years of direct experience coordinating disaster recovery planning, testing, evidence collection, incident readiness, or technology recovery programs. &lt;/li&gt;&lt;li&gt;Experience working across business and technology teams to document processes, validate assumptions, manage dependencies, and drive execution without direct authority. &lt;/li&gt;&lt;li&gt;Working knowledge of RTO, RPO, business impact analysis, recovery tiers, runbooks, tabletop exercises, failover concepts, cyber event response, and operational recovery planning. &lt;/li&gt;&lt;li&gt;Ability to interpret client commitments, SLAs, contract language, and risk obligations in partnership with Legal, Compliance, Sales, and Client Management. &lt;/li&gt;&lt;li&gt;Strong executive communication and client-facing skills, including the ability to explain technical recovery concepts in clear, business-oriented terms. &lt;/li&gt;&lt;li&gt;Demonstrated ability to build new processes, standards, templates, and governance routines in an environment where ownership and documentation may be evolving. &lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Preferred Qualifications &lt;/b&gt; &lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experience in payments, financial services, healthcare technology, claims, banking operations, or another regulated, transaction-intensive environment. &lt;/li&gt;&lt;li&gt;Familiarity with bank connectivity, payment processing dependencies, payment file movement, vendor dependencies, and business-critical operational workflows. &lt;/li&gt;&lt;li&gt;Experience supporting client-facing risk, audit, security, compliance, or recovery discussions. &lt;/li&gt;&lt;li&gt;Relevant certifications such as ABCP, MBCP, CBCI,  CBCP, CRISC, CISA, CISSP, ITIL, PMP, or similar are helpful but not required.&lt;/li&gt;&lt;li&gt;Experience working with third-party consultants, technology infrastructure teams, cloud or application teams, or enterprise DR programs. &lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;i&gt;&lt;b&gt;Please note at this time we are unable to proceed with candidates who require visa sponsorship now or in the future.&lt;/b&gt;&lt;/i&gt;&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Location and Workplace Flexibility&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Zelis is headquartered in the U.S., with multiple locations across the country and in Hyderabad, India. Check out our &lt;a target=\"_blank\" href=\"https://careers.zelis.com/us/en/locations\"&gt;&lt;span style=\"color:#0000ff\"&gt;&lt;u&gt;locations&lt;/u&gt;&lt;/span&gt;&lt;/a&gt; to learn more about our offices. All employee work locations are based on the needs of the position and are determined by the Leadership team. In-office work and activities vary based
