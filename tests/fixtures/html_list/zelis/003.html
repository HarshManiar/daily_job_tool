<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Zelis","value":"JR111654"},"hiringOrganization":{"@type":"Organization","name":"Zelis","sameAs":"https://careers.zelis.com/us/en","url":"https://careers.zelis.com/us/en/job/ZOBZDHUSJR111654EXTERNALENUS/Senior-CMDB-Cloud-Asset-Management-Engineer","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"17.44106","longitude":"78.38849"},"address":{"@type":"PostalAddress","postalCode":"500081","addressCountry":"India","addressLocality":"","addressRegion":"Telangāna"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;&lt;b&gt;About Us &lt;/b&gt;&lt;/p&gt;&lt;p&gt;Zelis is modernizing the healthcare financial experience in the United States (U.S.) across payers, providers, and healthcare consumers. We serve more than 750 payers, including the top five national health plans, regional health plans, TPAs and millions of healthcare providers and consumers across our platform of solutions. Zelis sees across the system to identify, optimize, and solve problems holistically with technology built by healthcare experts – driving real, measurable results for clients.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#292a2e\"&gt;At Zelis, AI is woven into the fabric of how we work. Every associate is expected - and empowered - to partner with AI to challenge the status quo, accelerate innovation, and amplify their impact. This is a place for builders with a growth mindset who act with agility, embrace change, and use modern technology to shape smarter solutions, exceptional experiences, and the future of our industry for our clients, customers, and our culture.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why We Do What We Do &lt;/b&gt;&lt;/p&gt;&lt;p&gt;In the U.S., consumers, payers, and providers face significant challenges throughout the healthcare financial journey. Zelis helps streamline the process by offering solutions that improve transparency, efficiency, and communication among all parties involved. By addressing the obstacles that patients face in accessing care, navigating the intricacies of insurance claims, and the logistical challenges healthcare providers encounter with processing payments, Zelis aims to create a more seamless and effective healthcare financial system.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Zelis India plays a crucial role in this mission by supporting various initiatives that enhance the healthcare financial experience. The local team contributes to the development and implementation of innovative solutions, ensuring that technology and processes are optimized for efficiency and effectiveness. Beyond operational expertise, Zelis India cultivates a collaborative work culture, leadership development, and global exposure, creating a dynamic environment for professional growth. With hybrid work flexibility, comprehensive healthcare benefits, financial wellness programs, and cultural celebrations, we foster a holistic workplace experience. Additionally, the team plays a vital role in maintaining high standards of service delivery and contributes to Zelis’ award-winning culture. &lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Position Overview&lt;/b&gt;&lt;/p&gt;Job Summary&lt;br&gt;The Senior CMDB, Discovery &amp; Cloud Asset Management Engineer designs, administers, governs, and continuously improves the enterprise CMDB and its discovery, asset-management, automation, and integration capabilities. The role is a key contributor to Cloud Modernization, with emphasis on scalable AWS/Azure CMDB models, automated cloud onboarding, and reliable asset relationships.&lt;br&gt;The engineer also leads asset-data quality and lifecycle improvements across Jira Service Management (JSM) Assets, Axonius, Tenable, Lansweeper, AWS, Azure, and other enterprise platforms, partnering with Cloud, Infrastructure, Cybersecurity, Application Services, Network, Endpoint, and ITSM teams.&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;JOB DESCRIPTION&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Senior CMDB &amp; Cloud Asset Management Engineer&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;i&gt;CMDB | Discovery | Cloud Asset Management | Automation&lt;/i&gt;&lt;/p&gt;&lt;br /&gt;&lt;h1&gt;Job Summary&lt;/h1&gt;&lt;p&gt;The Senior CMDB, Discovery &amp; Cloud Asset Management Engineer designs, administers, governs, and continuously improves the enterprise CMDB and its discovery, asset-management, automation, and integration capabilities. The role is a key contributor to Cloud Modernization, with emphasis on scalable AWS/Azure CMDB models, automated cloud onboarding, and reliable asset relationships.&lt;/p&gt;&lt;p&gt;The engineer also leads asset-data quality and lifecycle improvements across Jira Service Management (JSM) Assets, Axonius, Tenable, Lansweeper, AWS, Azure, and other enterprise platforms, partnering with Cloud, Infrastructure, Cybersecurity, Application Services, Network, Endpoint, and ITSM teams.&lt;/p&gt;&lt;br /&gt;&lt;h1&gt;Primary Skills&lt;/h1&gt;&lt;ul&gt;&lt;li&gt;Enterprise CMDB architecture, administration, governance, and object-schema design; Jira/JSM and JSM Assets.&lt;/li&gt;&lt;li&gt;Axonius, Lansweeper, Tenable, AWS, Azure, discovery, IT asset management, and cloud asset lifecycle management.&lt;/li&gt;&lt;li&gt;API integrations, workflow automation, data normalization, correlation, reconciliation, deduplication, and reporting.&lt;/li&gt;&lt;li&gt;ITSM/ITIL configuration-management practices, application/service mapping, troubleshooting, and stakeholder collaboration.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h1&gt;Key Responsibilities&lt;/h1&gt;&lt;br /&gt;&lt;h2&gt;1. CMDB Architecture, Governance &amp; Data Quality&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Design and maintain CMDB data models, CI classes, attributes, relationships, ownership models, lifecycle states, naming standards, and mandatory data-quality rules.&lt;/li&gt;&lt;li&gt;Define authoritative data sources and reconciliation priorities; automate CI creation, updates, validation, certification, archival, and retirement.&lt;/li&gt;&lt;li&gt;Maintain accurate relationships across applications, services, servers, databases, network devices, endpoints, cloud accounts/resources, and storage services.&lt;/li&gt;&lt;li&gt;Identify and remediate duplicate, stale, orphaned, incomplete, or inaccurate records; support audits, certification, compliance reviews, and governance reporting.&lt;/li&gt;&lt;li&gt;Maintain technical documentation for schemas, relationship models, integrations, governance standards, and operational procedures.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;2. Cloud Modernization &amp; Cloud CMDB Schema Development - Priority&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Design a scalable CMDB/JSM Assets model for AWS Organizations, organizational units, accounts, regions, applications, environments, and cloud resources, with reusable onboarding patterns for migration waves.&lt;/li&gt;&lt;li&gt;Model AWS services including EC2, EBS, S3, RDS, Lambda, ECS/EKS, VPC/network components, load balancers, IAM-related identities, backup/recovery, storage, and application/platform services.&lt;/li&gt;&lt;li&gt;Automate onboarding so new AWS accounts and resources are discovered, normalized, reconciled, related, updated, and retired with minimal manual intervention using AWS APIs, AWS Config, Axonius, and approved inventory sources.&lt;/li&gt;&lt;li&gt;Use stable identifiers such as account IDs, ARNs, regions, and tags; establish required metadata for ownership, application, environment, service, cost center, support group, and lifecycle status.&lt;/li&gt;&lt;li&gt;Extend object schemas and integrations to Azure, particularly subscriptions, resource groups, storage accounts, containers, file shares, and related application/service relationships.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;3. Tenable, Axonius &amp; Asset Hygiene - Priority&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Partner with Cybersecurity and Infrastructure teams to define governed asset inclusion, aging, retention, suppression, pruning, and retirement criteria across Tenable, Axonius, and the CMDB.&lt;/li&gt;&lt;li&gt;Identify stale, transient, decommissioned, duplicated, incorrectly correlated, unowned, or undiscovered assets while protecting valid assets that are temporarily offline or subject to maintenance cycles.&lt;/li&gt;&lt;li&gt;Reconcile hostnames, IPs, serial numbers, cloud IDs, agent IDs, operating systems, owners, support groups, and lifecycle states across Tenable, Axonius, CMDB, Lansweeper, endpoint, network, AWS, and Azure sources.&lt;/li&gt;&lt;li&gt;Automate exception identification, review/approval, remediation, CMDB updates, pruning evidence, and reporting to improve vulnerability-management coverage and auditability.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;4. Axonius Automation, Discovery &amp; Inventory&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Configure and optimize Axonius connectors, queries, correlation rules, dashboards, reports, workflow triggers, notifications, and API-based automations.&lt;/li&gt;&lt;li&gt;Monitor connector health, collection schedules, authentication, source coverage, and data freshness; troubleshoot mapping, correlation, synchronization, and automation issues.&lt;/li&gt;&lt;li&gt;Configure and optimize discovery/inventory solutions, including Lansweeper, and integrate discovery sources with the CMDB for CI creation, updates, relationship mapping, and retirement.&lt;/li&gt;&lt;li&gt;Improve discovery coverage for remote endpoints, cloud-hosted workloads, network devices, virtual infrastructure, and segmented environments; manage discovery failures, stale records, duplicates, and unclassified assets.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;5. Application, Service &amp; Cloud Storage Mapping&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Maintain business application, technical application, application service, platform service, and infrastructure relationships, including ownership, criticality, support groups, environments, lifecycle states, recovery needs, and service dependencies.&lt;/li&gt;&lt;li&gt;Map applications and services to AWS/Azure resources, databases, storage, servers, network components, and security assets; keep current-state and target-state relationships accurate through cloud migrations and retirements.&lt;/li&gt;&lt;li&gt;Design and maintain schemas and discovery/reconciliation processes for S3, EBS, Azure Storage accounts, blob containers, file shares, and other approved storage services.&lt;/li&gt;&lt;li&gt;Identify cloud/storage resources that are unowned, untagged, unused, incorrectly classified, or missing from the CMDB and support lifecycle, migration, audit, and security reporting.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;6. Jira Service Management, Integration &amp; Automation&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Configure and enhance Jira/JSM workflows, forms, fields, request types, permissions, notifications, queues, SLAs, automation rules, and JSM Assets schemas to support CMDB, asset, cloud-onboarding, discovery, and security processes.&lt;/li&gt;&lt;li&gt;Integrate CMDB, Jira/JSM, Axonius, Lansweeper, Tenable, AWS, Azure, and other systems using REST APIs, webhooks, scheduled imports, scripts, and approved integration platforms.&lt;/li&gt;&lt;li&gt;Automate cloud CI onboarding, relationship mapping, resource updates/retirement, Axonius-to-CMDB synchronization, Tenable/Axonius reconciliation, stale-asset workflows, duplicate detection, ownership/tag validation, discovery exceptions, and certification/audit reporting.&lt;/li&gt;&lt;li&gt;Define source-to-target mappings, transformation and reconciliation logic, monitoring, logging, alerting, error handling, retry processes, access controls, and version-controlled technical documentation.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;7. CMDB Health, Reporting &amp; Continuous Improvement&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Develop dashboards and metrics for completeness, correctness, compliance, uniqueness, freshness, discovery coverage, ownership, relationship completeness, reconciliation success, cloud-tagging compliance, pruning status, and integration/connector health.&lt;/li&gt;&lt;li&gt;Establish measurable thresholds and improvement targets; lead root-cause analysis for recurring data issues and track remediation through completion.&lt;/li&gt;&lt;li&gt;Provide actionable reporting to technical owners, service owners, management, security, audit, and governance stakeholders.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h1&gt;Immediate Role Priorities&lt;/h1&gt;&lt;ul&gt;&lt;li&gt;AWS Cloud Modernization: scalable CMDB/JSM Assets schemas, automated onboarding, application/service mapping, and storage visibility for AWS/Azure resources.&lt;/li&gt;&lt;li&gt;Tenable and Axonius hygiene: governed, auditable pruning/suppression of stale, duplicate, invalid, and decommissioned assets with stronger reconciliation and security coverage.&lt;/li&gt;&lt;li&gt;Automation and data quality: expand Axonius/Jira/API workflows for ownership, tagging, lifecycle, exceptions, CMDB updates, and measurable health improvements.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h1&gt;Required Qualifications&lt;/h1&gt;&lt;ul&gt;&lt;li&gt;Strong experience designing, administering, governing, or improving an enterprise CMDB, including cloud infrastructure and application/service schemas.&lt;/li&gt;&lt;li&gt;Hands-on Jira/JSM and JSM Assets (or comparable CMDB/asset platform), plus Axonius connectors, correlation, queries, reporting, and automation.&lt;/li&gt;&lt;li&gt;Experience with Lansweeper or comparable discovery/inventory tooling and Tenable or another vulnerability-management platform.&lt;/li&gt;&lt;li&gt;Working knowledge of AWS account structures, resource types, APIs, tagging, lifecycle management, and cloud governance; relevant Azure infrastructure/storage experience.&lt;/li&gt;&lt;li&gt;Experience integrating systems through REST APIs, webhooks, scheduled imports, scripts, or automation platforms, with strong data normalization, reconciliation, and deduplication skills.&lt;/li&gt;&lt;li&gt;Strong ITIL/ITSM, troubleshooting, reporting, documentation, analytical, and cross-functional stakeholder-management skills.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h1&gt;Preferred Qualifications&lt;/h1&gt;&lt;ul&gt;&lt;li&gt;Experience supporting large-scale AWS migration/Cloud Modernization; familiarity with AWS Organizations, AWS Config, CloudTrail, Azure subscriptions/resource groups, Azure Resource Graph, and Azure Storage.&lt;/li&gt;&lt;li&gt;Experience with Python, PowerShell, Bash, Groovy, or similar scripting and with Terraform, CloudFormation, AWS CDK, or comparable infrastructure-as-code tools.&lt;/li&gt;&lt;li&gt;Knowledge of service mapping, vulnerability-management asset lifecycle, regulated/audited environments, and relevant ITIL, Jira, Axonius, AWS, Azure, or asset-management certifications.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h1&gt;Measures of Success&lt;/h1&gt;&lt;ul&gt;&lt;li&gt;Standardized, scalable cloud CMDB schemas and automated AWS onboarding with minimal manual intervention.&lt;/li&gt;&lt;li&gt;Improved alignment across CMDB, Axonius, Tenable, Lansweeper, AWS, and Azure, with measurable reductions in duplicate, stale, orphaned, unowned, and untagged assets.&lt;/li&gt;&lt;li&gt;Governed asset pruning, stronger discovery/security coverage and application-to-cloud relationships, reduced manual effort through automation, and improved CMDB health and stakeholder confidence.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Commitment to Diversity, Equity, Inclusion, and Belonging&lt;/b&gt;&lt;/p&gt;&lt;p&gt;At Zelis, we champion diversity, equity, inclusion, and belonging in all aspects of our operations. We embrace the power of diversity and create an environment where people can bring their authentic and best selves to work. We know that a sense of belonging is key not only to your success at Zelis, but also to your ability to bring your best each day.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Equal Employment Opportunity&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Zelis is proud to be an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state or local laws. &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Accessibility Support&lt;/b&gt;&lt;/p&gt;&lt;p&gt;We are dedicated to ensuring our application process is accessible to all candidates. If you are a qualified individual with a disability and require reasonable accommodation with any part of the application and/or interview process, please email &lt;a target=\"_blank\" href=\"mailto:talentacquisition&#64;zelis.com?subject&#61;Accessibility%20Support%20Request\"&gt;&lt;span style=\"color:#0000ff\"&gt;&lt;u&gt;talentacquisition&#64;zelis.com&lt;/u&gt;&lt;/span&gt;&lt;/a&gt;.&lt;/p&gt;","title":"Senior CMDB & Cloud Asset Management Engineer","datePosted":"2026-11-11","@context":"http://schema.org","occupationalCategory":"Technology","directApply":false}</script>
