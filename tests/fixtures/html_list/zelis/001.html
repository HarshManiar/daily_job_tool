<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Zelis","value":"JR111812"},"hiringOrganization":{"@type":"Organization","name":"Zelis","sameAs":"https://careers.zelis.com/us/en","url":"https://careers.zelis.com/us/en/job/ZOBZDHUSJR111812EXTERNALENUS/Senior-SQL-Database-Administrator","logo":null},"jobLocation":[{"geo":{"@type":"GeoCoordinates","latitude":"40.79677","longitude":"-74.48154"},"address":{"@type":"PostalAddress","postalCode":"07960","addressCountry":"United States of America","addressLocality":"Morristown","addressRegion":"New Jersey"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"4.9E-324","longitude":"4.9E-324"},"address":{"@type":"PostalAddress","postalCode":"99999","addressCountry":"United States of America","addressLocality":"Remote","addressRegion":"Missouri"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"27.77086","longitude":"-82.67927"},"address":{"@type":"PostalAddress","postalCode":"33716","addressCountry":"United States of America","addressLocality":"St. Petersburg","addressRegion":"Florida"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"33.749","longitude":"-84.38798"},"address":{"@type":"PostalAddress","postalCode":"30328","addressCountry":"United States of America","addressLocality":"Atlanta","addressRegion":"Georgia"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"42.35843","longitude":"-71.05977"},"address":{"@type":"PostalAddress","postalCode":"02116","addressCountry":"United States of America","addressLocality":"Boston","addressRegion":"Massachusetts"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"38.66089","longitude":"-90.42262"},"address":{"@type":"PostalAddress","postalCode":"63141","addressCountry":"United States of America","addressLocality":"Creve Coeur","addressRegion":"Missouri"},"@type":"Place"}],"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p style=\"text-align:left !important\"&gt;At Zelis, we Get Stuff Done. So, let’s get to it! &lt;/p&gt;&lt;p style=\"text-align:inherit !important\"&gt;  &lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;&lt;b&gt;A Little About Us&lt;/b&gt; &lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;Zelis is modernizing the healthcare financial experience across payers, providers, and healthcare consumers. We serve more than 750 payers, including the top five national health plans, regional health plans, TPAs and millions of healthcare providers and consumers across our platform of solutions. Zelis sees across the system to identify, optimize, and solve problems holistically with technology built by healthcare experts – driving real, measurable results for clients.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#292a2e\"&gt;At Zelis, AI is woven into the fabric of how we work. Every associate is expected - and empowered - to partner with AI to challenge the status quo, accelerate innovation, and amplify their impact. This is a place for builders with a growth mindset who act with agility, embrace change, and use modern technology to shape smarter solutions, exceptional experiences, and the future of our industry for our clients, customers, and our culture.&lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit !important\"&gt;  &lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;&lt;b&gt;A Little About You&lt;/b&gt; &lt;/p&gt;&lt;p style=\"text-align:left !important\"&gt;You bring a unique blend of personality and professional expertise to your work, inspiring others with your passion and dedication. Your career is a testament to your diverse experiences, community involvement, and the valuable lessons you&#39;ve learned along the way. You are more than just your resume; you are a reflection of your achievements, the knowledge you&#39;ve gained, and the personal interests that shape who you are.&lt;/p&gt;&lt;p style=\"text-align:inherit !important\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Position Overview&lt;/b&gt;&lt;/p&gt;This role is responsible for designing, implementing, and optimizing complex database environments to ensure security, integrity, and high availability. This role provides advanced support for mission-critical systems, leads performance tuning initiatives, and contributes to strategic improvements in database architecture. This role operates with minimal supervision and collaborates across teams to deliver scalable and reliable solutions.&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;The Senior Database Engineer at Zelis is a hands-on technical role responsible for the engineering, administration, performance, modernization, and operational reliability of enterprise database platforms across AWS, Microsoft Azure, and on-premises environments. This role supports business-critical databases with a focus on performance, availability, monitoring, incident response, backup and recovery, disaster recovery, maintenance, upgrades, migrations, and lifecycle management. A key priority is modernizing the Zelis database estate, including migrating and re-platforming applications from Microsoft SQL Server to strategic platforms such as PostgreSQL and Amazon Aurora PostgreSQL. The Senior Database Engineer will work directly with application and engineering teams to assess schemas, queries, stored procedures, dependencies, and data access patterns and execute the technical work required to migrate, optimize, and operate these workloads. This position requires deep hands-on database engineering and DBA expertise, strong production troubleshooting skills, and experience with cloud database technologies, automation, monitoring, and Infrastructure as Code.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;br /&gt;&lt;br /&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;As a Senior Database Engineer at Zelis, you will be responsible for the hands-on engineering, administration, performance, modernization, and operational support of enterprise database platforms across Amazon Web Services (AWS), Microsoft Azure, and on-premises environments. This role is focused on the day-to-day engineering and operation of business-critical databases, including database performance, availability, monitoring, incident response, backup and recovery, disaster recovery, maintenance, upgrades, migrations, and lifecycle management.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;&lt;br /&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;A primary focus of this role over the next two to three years will be the hands-on migration and re-platforming of applications away from Microsoft SQL Server where appropriate, with an emphasis on PostgreSQL and Amazon Aurora PostgreSQL. You will work directly with application and engineering teams to analyze existing databases, schemas, queries, stored procedures, and data access patterns and perform the technical work required to migrate and optimize workloads on strategic database platforms.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;&lt;br /&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;This position requires strong hands-on DBA and database engineering skills and the ability to troubleshoot and resolve database issues in production environments. You will spend the majority of your time working directly with database platforms, SQL, automation, monitoring, Infrastructure as Code, migrations, performance tuning, and operational tooling.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;&lt;br /&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;&lt;b&gt;Key Responsibilities:&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Engineer, administer, maintain, and support enterprise database platforms across AWS, Azure, and on-premises environments, including Microsoft SQL Server, PostgreSQL, Amazon Aurora PostgreSQL, Amazon RDS for PostgreSQL, Amazon RDS for SQL Server, SQL Server on Amazon EC2, Azure SQL Database, Azure SQL Managed Instance, and SQL Server on Azure Virtual Machines.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Perform hands-on database performance engineering, including query tuning, execution plan analysis, schema tuning, index design and optimization, statistics maintenance and analysis, stored procedure optimization, database configuration, and analysis of application data access patterns.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Troubleshoot and resolve production database issues involving performance degradation, blocking, deadlocks, locking, resource contention, CPU, memory, storage, connectivity, capacity, availability, and database configuration.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Perform hands-on migration and re-platforming of databases and applications from Microsoft SQL Server to PostgreSQL, Amazon Aurora PostgreSQL, and other strategic database platforms.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Execute database migration activities including discovery, compatibility assessment, schema conversion, data migration, remediation, testing, performance validation, cutover, rollback, and post-migration optimization.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Install, configure, patch, upgrade, and maintain SQL Server and PostgreSQL database environments while ensuring database platforms remain current, supportable, secure, and compliant with established standards.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Configure, maintain, test, and troubleshoot database high availability, backup and restore, disaster recovery, replication, resiliency, and recovery capabilities.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Implement and maintain database telemetry, observability, monitoring, and alerting using IDERA, AWS-native monitoring capabilities, and other database monitoring tools.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Analyze database telemetry and performance data to proactively identify query performance problems, capacity constraints, resource contention, configuration issues, and emerging operational risks.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Participate in 24x7 production support and on-call rotations, responding to database incidents, troubleshooting problems, restoring service, performing root cause analysis, and implementing corrective actions.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Develop and maintain automation and Infrastructure as Code (IaC) for database provisioning, configuration, deployment, maintenance, monitoring, patching, upgrades, and other repeatable database engineering activities.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Use Git, GitHub, CI/CD, VS Code or other IDEs, peer review, and version control to develop and maintain database scripts, SQL code, automation, Infrastructure as Code, and engineering assets.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Use AI-assisted engineering tools including ChatGPT, Claude, Microsoft Copilot, and GitHub Copilot to assist with SQL development, troubleshooting, performance analysis, scripting, automation, migrations, and documentation.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Work directly with application engineers to identify and remediate inefficient queries, database schemas, indexes, stored procedures, data access patterns, and other application-related causes of database performance problems.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Create and maintain accurate technical documentation within Confluence, enterprise wikis, or equivalent platforms, including database configurations, operational procedures, runbooks, troubleshooting procedures, migration documentation, upgrade procedures, and disaster recovery processes.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;&lt;b&gt;Qualifications:&lt;/b&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Strong hands-on Microsoft SQL Server experience in business-critical production environments with demonstrated ability to independently diagnose and resolve complex database problems, including performance degradation, blocking, deadlocks, resource contention, failed jobs, availability issues, and production incidents.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Demonstrated database performance tuning expertise, including the ability to analyze execution plans, identify inefficient queries, tune T-SQL and stored procedures, design and optimize indexes, evaluate statistics and cardinality, troubleshoot locking and blocking, and identify schema or application data access patterns contributing to poor performance.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       AWS experience is required, with hands-on production experience operating databases on Amazon RDS, Amazon Aurora, and/or Amazon EC2. Experience with PostgreSQL and Amazon Aurora PostgreSQL is strongly preferred.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Demonstrated experience performing database migrations, upgrades, or re-platforming, including assessment, schema and compatibility analysis, data migration, testing, performance validation, cutover, rollback, and post-migration troubleshooting. Experience migrating Microsoft SQL Server workloads to PostgreSQL or Amazon Aurora PostgreSQL is strongly preferred.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Demonstrated ability to automate database engineering and operational tasks using scripting and Infrastructure as Code rather than relying primarily on manual administration. Experience with Git, GitHub, CI/CD, APIs, command-line tooling, and modern development environments such as VS Code is expected.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Hands-on experience implementing and troubleshooting database monitoring, telemetry, backup and recovery, high availability, and disaster recovery. Experience using IDERA, AWS-native observability services, or comparable database monitoring platforms is preferred.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"color:!important\"&gt;&lt;span style=\"color:#393939\"&gt;&lt;span&gt;·       Experience with Microsoft Azure database platforms, including Azure SQL Database, Azure SQL Managed Instance, and SQL Server on Azure VMs, is preferred but not required. Experience using AI-assisted engineering tools such as ChatGPT, Claude, Microsoft Copilot, or GitHub Copilot to improve troubleshooting, scripting, automation, and engineering productivity is also preferred.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;&lt;i&gt;&lt;b&gt;Please note at this time we are unable to proceed with candidates who require visa sponsorship now or in the future.&lt;/b&gt;&lt;/i&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:left !important\"&gt;&lt;b&gt;Location and Workplace Flexibility&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Zelis is headquartered in the U.S., with multiple locations across the country and in Hyderabad, India. Check out our &lt;a target=\"_blank\" href=\"https://careers.zelis.com/us/en/locations\"&gt;&lt;span style=\"color:#0000ff\"&gt;&lt;u&gt;locations&lt;/u&gt;&lt;/span&gt;&lt;/a&gt; to learn more about our offices. All employee work locations are based on the needs of the position and are determined by the Leadership team. In-office work and activities vary based on work and team objectives in accordance with Company policies.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;While location expectations vary by role, candidates within approximately 50 miles of a U.S. office are generally preferred to support collaboration when needed. Our hybrid approach is flexible, and in-office presence is guided by team and business needs rather than a fixed weekly schedule. &lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Base Salary Range&lt;/b&gt;&lt;/p&gt;$105,000.00 - $133,000.00&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;At Zelis we are committed to providing fair and equitable compensation packages. The base salary range allows us to make an offer that considers multiple individualized factors, including experience, education, qualifications, as well as job-related and industry-related knowledge and skills, etc. Base pay is just one part of our Total Rewards package, which may also include discretionary bonus plans, commissions, or other incentives depending on the role.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;Zelis’ full-time associates are eligible for a highly competitive benefits package as well, which demonstrates our commitment to our employees’ health, well-being, and financial protection. The US-based benefits include a 401k plan with employer match, flexible paid time off, holidays, parental leaves, life and disability insurance, and health benefits including medical, dental, vision, and prescription drug coverage.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Equal Employment Opportunity &lt;/b&gt; &lt;br /&gt;Zelis is proud to be an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state or local laws. &lt;br /&gt; &lt;br /&gt;We welcome applicants from all backgrounds and encourage you to apply even if you don’t meet 100% of the qualifications for the role. We believe in the value of diverse perspectives and experiences and are committed to building an inclusive workplace for all. &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Accessibility Support&lt;/b&gt; &lt;br /&gt;We are dedicated to ensuring our application process is accessible to all candidates. If you are a qualified individual with a disability or a disabled veteran and require a reasonable accommodation with any part of the application and/or interview process, please email &lt;a target=\"_blank\" href=\"mailto:TalentAcquisition&#64;zelis.com\"&gt;&lt;u&gt;TalentAcquisition&#64;zelis.com&lt;/u&gt;&lt;/a&gt;. &lt;/p&gt;&lt;p&gt;&lt;i&gt; &lt;/i&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Disclaimer&lt;/b&gt; &lt;/p&gt;&lt;p&gt;&lt;i&gt;The above statements are intended to describe the general nature and level of work being performed by people assigned to this classification. They are not to be construed as an exhaustive list of all responsibilities, duties, and skills required of personnel so classified. All personnel may be required to perform duties outside of their normal responsibilities, duties, and skills from time to time.&lt;/i&gt; &lt;/p&gt;","title":"Senior SQL Database Administrator","datePosted":"2026-10-20","@context":"http://schema.org","occupationalCategory":"Technology","directApply":false}</script>
