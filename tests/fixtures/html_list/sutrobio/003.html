and the business, balancing public-company rigor with practical, efficient execution.</span></p><h1 style=\"margin: 9.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(39,112,139);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Responsibilities</span></h1><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Accounting Close and Reporting Support</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Own the monthly, quarterly, and annual close, reconciliations, and internal management reporting; ensure accurate and complete accounting records in accordance with U.S. GAAP.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Provide timely, accurate accounting data, reconciliations, and supporting schedules </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">for</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\"> SEC and other external reporting.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Provide accounting data, reconciliations, schedules, and operational support for complex or non-routine transactions, as needed.</span></p><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Clinical and R&amp;D Accounting</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Oversee</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\"> the accounting components of Clinical/R&amp;D accruals, prepayments, commitments, and program-level expenses, including review of estimates, journal entries, reconciliations, and true-ups.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Partner with Clinical Operations, Technical Operations, and FP&amp;A to establish supportable accruals for contract research organizations, contract manufacturers, and investigator sites using contracts, operational progress, and vendor data.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Provide operational accounting support for collaboration and license arrangements, including gathering and reconciling data related to milestone payments and cost-sharing activities, as applicable.</span></p><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Internal Controls, Audit, and Compliance</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Lead SOX and internal control activities within accounting, including risk assessment, documentation, testing, and remediation, using a COSO-based framework appropriate to the business.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Support management assessments </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">and </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">external auditor attestation </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">under SOX Section 404. Partner with IT and business process owners on access, segregation of duties, and related controls.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Serve as the primary accounting contact for external auditors; coordinate audit and quarterly-review support for accounting operations and SOX testing. Escalate significant accounting and control matters to the VP, Finance.</span></p><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Accounting Operations</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Oversee General Ledger, Accounts Payable, disbursements, fixed assets, and expense processes. Maintain effective </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">invoice-processing</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">, payment-approval, and disbursement controls.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Support income tax provision and compliance activities by providing accurate accounting records and schedules to the responsible internal teams and external advisors.</span></p><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Systems and Operational Efficiency</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Lead improvements to accounting systems, integrations, and data quality in partnership with IT. Streamline close, accrual, Accounts Payable, and internal reporting workflows through automation, including appropriate AI-enabled tools with effective review and data protection controls.</span></p><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Team Leadership and Business Partnership</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Lead, mentor, and develop the accounting team and manage accounting service providers. Establish clear accountability, cross-training, and professional development opportunities.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Partner with the VP, Finance, and FP&amp;A to provide reliable actuals, accruals, and insights for budgeting, forecasting, cash planning, and liquidity assessments.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Provide accounting analysis and due diligence support for </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">financings</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">, partnerships, and other corporate transactions. Communicate complex issues clearly and raise risks early with practical recommendations.</span></p><h1 style=\"margin: 9.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(39,112,139);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Qualifications</span></h1><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Bachelor's degree in Accounting</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">, Finance, or </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">a related</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\"> discipline; CPA required</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">; Big Four </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">experience preferred.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">10+ years of progressive accounting experience, including at least </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">3</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\"> years leading teams and significant experience within a U.S. publicly traded biotechnology or life sciences company.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Prior hands-on experience in an operational accounting role, including direct responsibility for leading public-company accounting operations, the financial close, preparation of accounting analyses, audit support, and SOX compliance.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Proficiency with ERP and accounting systems; advanced Excel skills and a track record of improving close, accrual, and internal reporting processes and data quality.</span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 3.0pt 11.5pt;text-indent: -10.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 11.0pt;\">\u2022</span><span style=\"font: 7.0pt;\">\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">Demonstrated success developing teams and influencing cross-functional partners in a lean environment. Strong analytical and communication skills, sound judgment, integrity, and the confidence to challenge assumptions and uphold accounting standards.</span></p><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">\u00A0</span></h2><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 6.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Sound exciting? Apply today and join our team! </span></p><p style=\"font-size: 11.0pt;line-height: 103.0%;margin: 0.0pt 0.0pt 6.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;\">S  11.0pt;font-weight: normal;\">XpressCF</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\">\u00AE, provides the opportunity for broader patient benefit and an improved patient experience. Sutro is advancing a robust early-stage pipeline of novel </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\">exatecan</span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\"> and dual-payload antibody drug conjugates (ADCs), coupled with high-value collaborations and industry partnerships, which validate its continuous product innovation. Sutro is headquartered in South San Francisco. For more information, follow Sutro on social media @Sutrobio, or visit </span><a style=\"color: rgb(70,120,134);\" href=\"http://www.sutrobio.com/\"><span style=\"color: rgb(70,120,134);font-family: Calibri;font-size: 11.0pt;font-weight: normal;text-decoration: underline;\">www.sutrobio.com</span></a></p><div style=\"\"><p style=\"font-size: 10.0pt;line-height: 103.0%;margin: 0.05pt 0.0pt 6.0pt 37.95pt;\"><span style=\"color: rgb(32,42,51);font-family: Arial;font-size: 10.0pt;font-weight: bold;\">\u00A0</span></p></div></div>",
