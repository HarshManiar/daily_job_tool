/span></h2><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 0.0pt 15.85pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Provide strong clinical safety expertise across programs. </span><span style=\"font-family: Calibri;font-size: 11.0pt;\">Partner</span><span style=\"font-family: Calibri;font-size: 11.0pt;\"> with global study leads and Pharmacovigilance to review emerging safety data, assess potential signals and benefit-risk, and recommend appropriate follow-up and risk mitigation.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 0.0pt 15.85pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Serve as a backup medical monitor to global study leads and other designated medical monitors, providing coverage for investigator questions, eligibility assessments, medical review of adverse events, and protocol-related medical decisions.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 5.0pt 15.85pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Support safety review meetings and clinical interpretation of adverse events and laboratory trends; help translate findings into monitoring recommendations, protocol updates, and clear communication to study teams.</span></li></ul><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Regulatory and leadership communications</span></h2><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 0.0pt 15.85pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Support Regulatory Affairs, the VP, Clinical Development, and study </span><span style=\"font-family: Calibri;font- ze: 11.0pt;\">Help plan and lead scientific advisory boards and expert discussions; develop focused questions, evaluate external input, and translate recommendations into practical development options.</span></li></ul><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Collaboration and organizational contribution</span></h2><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 0.0pt 15.85pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Work across Clinical Operations, Pharmacovigilance, Translational Medicine, Biostatistics, Data Management, and Regulatory Affairs to align on clinical questions, resolve issues, and support timely decisions.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 5.0pt 15.85pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Mentor colleagues, communicate candidly, and contribute to consistent clinical development practices that support patient safety, scientific rigor, data integrity, and quality.</span></li></ul><h1 style=\"margin: 9.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(39,112,139);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Qualifications</span></h1><h2 style=\"margin: 6.0pt 0.0pt 4.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Required</span></h2><div style=\"margin: 6.0pt 0.0pt 4.0pt 36.0pt;text-indent: -18.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Symbol;font-size: 11.0pt;font-weight: bold;\">\u2022</span><span style=\"font: 7.0pt &quot;Times New Roman&quot;;\">\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\">MD or MD/PhD required with substantial experience in oncology clinical development.</span></div><div style=\"margin: 6.0pt 0.0pt 4.0pt 36.0pt;text-indent: -18.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Symbol;font-size: 11.0pt;font-weight: bold;\">\u2022</span><span style=\"font: 7.0pt &quot;Times New Roman&quot;;\">\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\">Approximately 10 or more years of relevant clinical research and drug development experience, including substantial clinical development experience in the biotechnology or pharmaceutical industry.</span></div><div style=\"margin: 6.0pt 0.0pt 4.0pt 36.0pt;text-indent: -18.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Symbol;font-size: 11.0pt;font-weight: bold;\">\u2022</span><span style=\"font: 7.0pt &quot;Times New Roman&quot;;\">\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\">Strong clinical safety background, including medical monitoring, assessment of adverse events and emerging safety signals, benefit-risk evaluation, and collaboration with Pharmacovigilance.</span></div><div style=\"margin: 6.0pt 0.0pt 4.0pt 36.0pt;text-indent: -18.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Symbol;font-size: 11.0pt;font-weight: bold;\">\u2022</span><span style=\"font: 7.0pt &quot;Times New Roman&quot;;\">\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 </span><span style=\"color: rgb(32,42,51);font-family: Calibri;font-size: 11.0pt;font-weight: normal;\">Prior experience leading interventional clinical studies and direct experience with global trials involving investigators and teams across multiple countries.</span></div><div style=\"margin: 6.0pt 0.0pt 4.0pt 36.0pt;text-indent: -18.0pt;\"><span style=\"color: rgb(32,42,51);font-family: Symbol;font-size: 11.0pt;font-weight: bold;\">\u2022</span><span style=\"font
