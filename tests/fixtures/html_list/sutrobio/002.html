<script type="application/ld+json">
        {

            "description": "<div><div style=\"\"></div><p style=\"margin: 0.0pt;\"><span style=\"color: rgb(84,141,212);font-family: Calibri;font-size: 18.0pt;font-weight: bold;\">Senior Biostatistician</span></p><p style=\"margin: 0.0pt;\"><span style=\"color: rgb(84,141,212);font-family: Calibri;font-size: 12.0pt;font-weight: bold;\">\u00A0</span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"\"></span><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Position Summary:</span><br /><br /><span style=\"font-family: Calibri;font-size: 11.0pt;\">The Senior Biostatistician is an integral contributor within Sutro Biopharma\u2019s Clinical Development organization. The role provides hands-on biostatistical support for clinical studies and contributes to statistical programming for analysis, data review, and decision-making. Working closely with Clinical Development, Clinical Operations, Data Management, Statistical Programming, Clinical Pharmacology, Translational Sciences, and Regulatory Affairs, this person helps turn clinical and scientific questions into sound study designs and reliable, interpretable analyses.</span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">The role is primarily focused on biostatistics, with meaningful responsibility for writing, reviewing, and validating statistical programs. The Senior Biostatistician may serve as the study statistician for assigned trials, coordinate work with CRO partners, and remain directly engaged with emerging patient data.</span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">\u00A0</span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Key </span><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Responsibilities:</span></p><h1 style=\"font-size: 11.0pt;font-weight: normal;line-height: 115.0%;margin: 12.0pt 0.0pt 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Biostatistics and Clinical Study Support</span></h1><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 34.05pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Serve as the study biostatistician for assigned early-phase oncology trials, providing statistical input from protocol development through data review, analysis, interpretation, and clinical study reporting.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 34.05pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Contribute to study designs, endpoint definitions, analysis populations, sample size assumptions, dose-escalation and expansion approaches, and quantitative decision criteria; use simulations when useful.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 34.05pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Prepare or contribute to protocol statistical sections, statistical analysis plans, mock tables, listings and figures, analysis specifications, and clinical study report sections.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 34.05pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Analyze and interpret safety, efficacy, pharmacokinetic, pharmacodynamic, and biomarker data, accounting for the limitations of small and evolving datasets.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 34.05pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Support cohort reviews, dose optimization discussions, and ad hoc analyses that inform clinical and program decisions; communicate assumptions and uncertainty clearly to cross-functional teams.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 4.0pt 34.05pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Review clinical data and analysis outputs for quality, consistency, and scientific plausibility; identify issues that could affect interpretation and work with partners to resolve them.</span></li></ul><h1 style=\"font-size: 11.0pt;font-weight: normal;line-height: 115.0%;margin: 12.0pt 0.0pt 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Statistical Programming and Data Outputs</span></h1><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Use SAS and/or R to conduct exploratory analyses, simulations, data checks, and visualizations; document code and results so analyses are reproducible.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Program or independently validate selected analysis datasets, tables, listings, figures, and patient-level displays, particularly for emerging data reviews and time-sensitive clinical questions.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Collaborate with statistical programmers and CROs on dataset specifications, analysis derivations, output shells, and quality control; review programmed deliverables against the statistical analysis plan and source data.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 4.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Apply working knowledge of CDISC SDTM and ADaM standards to understand data lineage, support analysis-ready datasets, and review submission-related outputs as assigned.</span></li></ul><h1 style=\"font-size: 11.0pt;font-weight: normal;line-height: 115.0%;margin: 12.0pt 0.0pt 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Collaboration Quality and External Partners</span></h1><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Provide technical direction and review for assigned CRO biostatistics and programming deliverables, tracking quality and timelines and escalating issues to the appropriate study or functional lead.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Partner with Clinical Development, Data Management, Clinical Operations, Clinical Pharmacology, Translational Sciences, and Drug Safety on data collection, interpretation, and presentation.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Contribute statistical analyses and documentation to clinical study reports, scientific presentations, manuscripts, regulatory submissions, and health authority responses as assigned.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Follow applicable GCP and ICH requirements, company procedures, and established standards for data integrity, code validation, documentation, and inspection readiness.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 4.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Help improve statistical and programming templates, workflows, and reproducible analysis practices; share technical knowledge with colleagues and external partners.</span></li></ul><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><br /><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Qualifications</span><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">:</span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Master\u2019s degree in Statistics, Biostatistics, or a related quantitative field with at least 5 years of relevant biopharmaceutical clinical trial experience; or a PhD with at least 3 years of relevant experience. Equivalent combinations of education and experience will be considered.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Experience providing independent statistical support for clinical studies, including protocol input, statistical analysis plans, analysis specifications, and interpretation of trial results.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Hands-on statistical programming experience in SAS and/or R, including analysis, visualization, and independent quality control of datasets or statistical outputs.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Working knowledge of clinical trial data structures and CDISC standards, including SDTM and ADaM, and experience reviewing tables, listings, and figures.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 4.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Ability to explain statistical concepts and data limitations clearly to clinical and scientific colleagues and manage several deliverables in a collaborative environment.</span></li></ul><h1 style=\"font-size: 11.0pt;font-weight: normal;line-height: 115.0%;margin: 12.0pt 0.0pt 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">\u00A0</span><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Preferred Experience</span><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">:</span></h1><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Early-phase oncology studies, including dose escalation, dose expansion, dose optimization, or exploratory biomarker analyses.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 0.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Experience with antibody-drug conjugates or other oncology therapeutics; exposure to small, clinical-stage biotechnology teams.</span></li><li style=\"font-family: serif;font-size: 11.0pt;line-height: 112.0%;margin: 0.0pt 0.0pt 4.0pt 26.85pt;padding-left: 9.15pt;text-indent: 0.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Experience coordinating or reviewing CRO statistical and programming work and supporting regulatory documents or health authority questions.</span></li></ul><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">\u00A0</span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;font-weight: bold;\">Sound exciting? Apply today and join our team! </span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">Sutro Biopharma, Inc. encourages all colleagues to be fully vaccinated for COVID-19 prior to the first date of employment. </span></p><p style=\"font-size: 11.0pt;line-height: 108.0%;margin: 0.0pt 0.0pt 8.0pt;\"><span style=\"font-family: Calibri;font-size: 11.0pt;\">As an equal opportunity employer, we believe in fostering a culture that is inclusive and values diversity in background and opinions. Sutro Biopharma hires extraordinary individuals into every position in the company and is committed to the diversity of our team. Our company progresses without regard of race, ethnicity, gender, sexual orientation, religious belief, age, disability or citizenship status. We are dedicated to creating a safe environment where our employees can grow and succeed together.
