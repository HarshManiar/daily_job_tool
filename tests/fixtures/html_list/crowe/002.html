<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Crowe Advisory LLC","value":"R-52535"},"hiringOrganization":{"@type":"Organization","name":"Crowe Advisory LLC","sameAs":"https://careers.crowe.com","url":"https://careers.crowe.com/job/CROCROUSR52535EXTERNALENUS/Tax-Transaction-Advisory-Project-Manager","logo":"https://assets.phenompeople.com/CareerConnectResources/pp/CROCROUS/images/job_logo_config-1667320529804.jpg"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"41.6745337","longitude":"-86.2463914"},"address":{"@type":"PostalAddress","postalCode":"46601","addressCountry":"United States of America","addressLocality":"South Bend","addressRegion":"Indiana"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Your Journey at Crowe Starts Here:&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;span&gt;At Crowe, you can build a meaningful and rewarding career. With real flexibility to balance work with life moments, you’re trusted to deliver results and make an impact. We embrace you for who you are, care for your well-being, and nurture your career. Everyone has equitable access to opportunities for career growth and leadership. Over our 80-year history, delivering excellent service through innovation has been a core part of our DNA across our audit, tax, and consulting groups. That’s why we continuously invest in innovative ideas, such as AI-enabled insights and technology-powered solutions, to enhance our services. Join us at Crowe and embark on a career where you can help shape the future of our industry.&lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job Description:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;The Manager, Tax Transaction Advisory Project Manager leads the operational execution, coordination and performance management of complex tax transaction engagements and private equity client relationships. This role serves as a central point of accountability for engagement governance, cross-functional service delivery, resource and workflow planning, financial reporting, and continuous improvement. Working closely with tax, transaction services, audit, advisory and relationship leadership, the Manager translates strategic priorities into disciplined execution, provides actionable insights on engagement economics and capacity, and helps deliver a consistent client experience across the deal lifecycle and recurring compliance services.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Client Account & Engagement Leadership&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Lead cross-service-line coordination and recurring account reviews, aligning transaction, compliance, audit and advisory teams on commitments, deliverables and client priorities.&lt;/li&gt;&lt;li&gt;Own and continuously improve integrated account service plans across PEG funds, portfolio companies and related service lines; maintain internal operational and client-ready views, milestone calendars, key contacts, risks and escalations.&lt;/li&gt;&lt;li&gt;Oversee engagement-letter workflows, scope documentation, conflict-check coordination, signature completion and consistent engagement setup practices.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Transaction Lifecycle & Delivery Governance&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Direct project management infrastructure for M&A tax engagements, including workplans, deal trackers, document request lists, SharePoint workspaces, standardized deliverables and retention controls.&lt;/li&gt;&lt;li&gt;Coordinate closing and post-close activities, including invoices, payment follow-up, closing documentation, remediation items, voluntary disclosure agreements and transition into recurring compliance.&lt;/li&gt;&lt;li&gt;Maintain deal-roll visibility, facilitate handoffs across teams and surface follow-on service opportunities to relationship and service-line leaders.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Operational Excellence&lt;/b&gt;&lt;br /&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Standardize project trackers, time-entry codes, workflow tools and reporting routines to improve transparency, consistency and accountability.&lt;/li&gt;&lt;li&gt;Lead planning and monitoring of milestones, resource assignments, work-in-progress, planned versus actual hours and delivery bottlenecks; escalate capacity or execution risks promptly.&lt;/li&gt;&lt;li&gt;Coordinate critical tax data flows and K-1 delivery dependencies among portfolio-company, fund and individual tax teams.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Financial Management & Performance Analytics&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Support engagement budgets, proposal development, rate-card consistency and forecasts of resource demand and financial performance.&lt;/li&gt;&lt;li&gt;Oversee engagement billing coordination, accounts-receivable visibility, aging escalations and fee-related independence tracking in partnership with appropriate leaders.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Leadership & Stakeholder Partnership&lt;/b&gt;&lt;br /&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Drive process improvements and adoption of standard practices across teams without compromising client service, quality or compliance requirements.&lt;/li&gt;&lt;li&gt;Act as a trusted operational partner to TTA leaders, providing concise management reporting, decision support and proactive risk identification.&lt;/li&gt;&lt;li&gt;Coordinate stakeholders across tax, transaction services, finance, legal, compliance and other service lines to resolve issues and keep engagements on track.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Qualifications&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experience managing complex projects, client-service operations or professional-services engagements, preferably in tax, transaction advisory, accounting or consulting.&lt;/li&gt;&lt;li&gt;Demonstrated ability to lead cross-functional initiatives, manage competing deadlines, influence stakeholders and communicate with senior leaders.&lt;/li&gt;&lt;li&gt;Strong financial and analytical acumen, including budgets, billing, utilization, realization, margins and operational performance reporting.&lt;/li&gt;&lt;li&gt;Proficiency with Microsoft Excel, PowerPoint, SharePoint and workflow/reporting tools; familiarity with Workday or comparable professional-services systems is beneficial.&lt;/li&gt;&lt;li&gt;Excellent judgment, organization, attention to detail and commitment to confidentiality and high-quality client service.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Measures of Success&lt;/b&gt;&lt;/p&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Predictable delivery against engagement milestones and timely resolution of risks and escalations.&lt;/li&gt;&lt;li&gt;Improved visibility into capacity, chargeability, realization, margins and receivables.&lt;/li&gt;&lt;li&gt;Consistent adoption of standardized engagement processes, documentation and account reporting.&lt;/li&gt;&lt;li&gt;Effective handoffs from transaction close to recurring services and stronger cross-service-line collaboration.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br /&gt;#LI-Remote #LI-Hybrid&lt;br /&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;We expect the candidate to uphold Crowe’s values of Care, Trust, Courage, and Stewardship. These values define who we are. We expect all of our people to act ethically and with integrity at all times.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;In compliance with federal law, all persons hired will be required to verify identity and eligibility to work in the United States and to complete the required employment eligibility verification form upon hire. Crowe is not sponsoring for work authorization at this time.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;The wage range for this role takes into account the wide range of factors that are considered in making compensation decisions including but not limited to skill sets; experience and training; licensure and certifications; and other business and organizational needs. The disclosed range estimate has not been adjusted for the applicable geographic differential associated with the location at which the position may be filled. At Crowe, it is not typical for an individual to be hired at or near the top of the range for their role and compensation decisions are dependent on the facts and circumstances of each case. A reasonable estimate of the current range is $94,800.00 - $193,900.00 per year.&#xa;&#xa;This role follows a hybrid work model for candidates located near a Crowe office. Candidates who are not within commuting distance of a Crowe office may be considered for a remote work arrangement, subject to business needs.&lt;br /&gt;&lt;p&gt;&lt;b&gt;Our Benefits:&lt;/b&gt;&lt;br /&gt;Your exceptional people experience starts here. At Crowe, we know that great people are what makes a great firm. We care about our people and offer employees a comprehensive total rewards package. &lt;a target=\"_blank\" href=\"https://www.crowe.com/careers/why-crowe/benefits\"&gt;Learn more about what working at Crowe can mean for you!&lt;/a&gt;&lt;br /&gt;&lt;br /&gt;&lt;b&gt;How You Can Grow:&lt;/b&gt;&lt;br /&gt;We will nurture your talent in an inclusive culture that values diversity. You will have the chance to meet on a consistent basis with your Career Coach that will guide you in your career goals and aspirations. Learn more about where talent can prosper!&lt;br /&gt;&lt;br /&gt;&lt;b&gt;More about Crowe:&lt;/b&gt;&lt;br /&gt;Crowe provides professional services through two separate entities: Crowe LLP delivers audit and attest services, and Crowe Advisory LLC provides tax, advisory, consulting, and other nonattest services.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;The Crowe Global network consists of more than 300 independent accounting and advisory services firms in more than 150 countries around the globe, making it one of the largest accounting networks in the world.* As independent members of Crowe Global, Crowe LLP and Crowe Advisory LLC serve clients worldwide.   &lt;/p&gt;&lt;br /&gt;&lt;p&gt;*As of July 2026.&lt;br /&gt;&lt;br /&gt;Crowe LLP and Crowe Advisory LLC (and their respective subsidiary entities) provides equal employment opportunities to all employees and applicants for employment and prohibits discrimination and harassment of any type without regard to race, color, religion, age, sex, sexual orientation, gender identity or expression, genetics, national origin, disability or protected veteran status, or any other characteristic protected by federal, state or local laws.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Crowe LLP and Crowe Advisory LLC (and their respective subsidiary entities) does not accept unsolicited candidates, referrals or resumes from any staffing agency, recruiting service, sourcing entity or any other third-party paid service at any time. Any referrals, resumes or candidates submitted to Crowe, or any employee or owner of Crowe without a pre-existing agreement signed by both parties covering the submission will be considered the property of Crowe, and free of charge.&lt;/p&gt;&lt;br /&gt;Crowe will consider for employment all qualified applicants, including those with criminal histories, in a manner consistent with the requirements of applicable state and local laws.&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;a target=\"_blank\" href=\"http://careers.crowe.com/ban-the-box-and-fair-chance-hiring-notices\"&gt;Please visit our webpage&lt;/a&gt; to see notices of the various state and local Ban-the-Box laws and Fair Chance Ordinances, where applicable.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;We are committed to a merit-based hiring process, evaluating all candidates consistently using objective, job-related criteria such as relevant experience, demonstrated skills, measurable impact, and alignment with the role’s responsibilities, and making employment decisions in a fair and inclusive manner free from discrimination.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;If you are interested in applying for employment with Crowe and are in need of an accommodation or require special assistance to navigate our website or to complete your application, please visit our Applicant Assistance and Accommodations page for more information: &lt;a target=\"_blank\" href=\"https://careers.crowe.com/crowe-applicant-assistance-and-accommodation\"&gt;&lt;u&gt;https://careers.crowe.com/crowe-applicant-assistance-and-accommodation&lt;/u&gt;&lt;/a&gt;&lt;/p&gt;","industry":"Line of Business","title":"Tax Transaction Advisory Project Manager","datePosted":"2026-11-01","@context":"http://schema.org","occupationalCategory":"Tax","directApply":false}</script>
