<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"C3 India Delivery Centre LLP","value":"R-51868"},"hiringOrganization":{"@type":"Organization","name":"C3 India Delivery Centre LLP","sameAs":"https://careers.crowe.com","url":"https://careers.crowe.com/job/CROCROUSR51868EXTERNALENUS/Senior-Consultant-Technology-Risk-Internal-Controls","logo":"https://assets.phenompeople.com/CareerConnectResources/pp/CROCROUS/images/job_logo_config-1667320529804.jpg"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"28.6216204","longitude":"77.3565863"},"address":{"@type":"PostalAddress","postalCode":"201301201309","addressCountry":"India","addressLocality":"Noida","addressRegion":"Uttar Pradesh"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Your Journey at Crowe Starts Here:&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;span&gt;At Crowe, you can build a meaningful and rewarding career. With real flexibility to balance work with life moments, you’re trusted to deliver results and make an impact. We embrace you for who you are, care for your well-being, and nurture your career. Everyone has equitable access to opportunities for career growth and leadership. Over our 80-year history, delivering excellent service through innovation has been a core part of our DNA across our audit, tax, and consulting groups. That’s why we continuously invest in innovative ideas, such as AI-enabled insights and technology-powered solutions, to enhance our services. Join us at Crowe and embark on a career where you can help shape the future of our industry.&lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job Description:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;What It Means to Be a Consultant at Crowe&lt;/b&gt;&lt;br /&gt;Consulting is a dynamic business focused on solving problems for our clients and serving our core markets through innovative solutions. As technology and AI continue to reshape the consulting landscape, we are looking for individuals who are curious, adaptable, and eager to learn. At Crowe, consultants are expected to build both technical and transferable skills, think critically, and use technology to solve real business problems. In this role, you will continuously learn, collaborate across teams, and explore how tools, including emerging AI capabilities, can improve efficiency, insights, and client outcomes.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;As you grow, you’ll also begin to take ownership of client relationships, contribute to account strategy, and support the delivery of high-impact work. Developing a sense of account leadership, including understanding client needs, ensuring delivery excellence, and building trusted partnerships, is part of what sets successful consultants apart.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Success in this role comes from a growth mindset, strong communication skills, advanced critical thinking, and the ability to navigate new challenges with confidence.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;The &lt;b&gt;Technology Risk and Controls Senior Staff&lt;/b&gt; professional is experienced contributor who supports client projects by performing IT control testing, documentation, and compliance review activities. This position is a key execution resource to internal audit and advisory engagements by supporting risk assessment, IT process and control walkthrough and testing via evidence evaluation.&lt;/p&gt;&lt;p&gt;You’ll develop a deeper understanding of how technology supports business objectives and learn to identify and mitigate risks that impact security, compliance, and performance. You’ll gain exposure to diverse clients, industries, and technologies while building a strong foundation for advancement into internal audit leadership or risk consulting roles.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Responsibilities:&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Independently execute detailed testing procedures over access management, change management, IT operations, and system interfaces in accordance with firm methodologies and regulatory standards (e.g., SOX, SOC, NIST, ISO 27001).&lt;/li&gt;&lt;li&gt;Able to identify and document key IT risks, control gaps, and improvement opportunities across enterprise systems, cloud environments, and digital platforms.&lt;/li&gt;&lt;li&gt;Proactively analyze and clearly articulate the design and effectiveness of automated controls, system configurations, and data flows that support financial, operational, and compliance objectives.&lt;/li&gt;&lt;li&gt;Prepare clear, well-supported documentation and workpapers in accordance with firm and regulatory standards.&lt;/li&gt;&lt;li&gt;Work closely with business, risk, and technology stakeholders, including management, IT leadership, and occasionally regulators, to communicate findings and recommendations clearly and professionally.&lt;/li&gt;&lt;li&gt;Contribute to the development of reports and client deliverables that summarize observations, root causes, and practical recommendations for risk mitigation and process improvement.&lt;/li&gt;&lt;li&gt;Build foundational skills in areas such as cybersecurity, cloud computing, identity and access management, data analytics, automation tools, and industry-specific regulations (e.g., HIPAA, SEC, FFIEC).&lt;/li&gt;&lt;li&gt;Approach new challenges with curiosity and a critical-thinking mindset, learning from diverse projects and client environments.&lt;/li&gt;&lt;li&gt;Participate in team collaboration, coaching, and knowledge-sharing to foster a supportive and high-performance culture.&lt;/li&gt;&lt;li&gt;Support coaching and review of Staff work, providing feedback and knowledge sharing.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Basic Qualifications:&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Chartered Accountant, MBA, CMA, bachelor’s degree in information systems, Computer Science, Information Technology, or related fields.&lt;/li&gt;&lt;li&gt;2-4 years of experience in IT internal audit, risk management, or consulting.&lt;/li&gt;&lt;li&gt;Basic understanding of IT controls, IT SOX, system development lifecycle (SDLC), and IT governance frameworks.&lt;/li&gt;&lt;li&gt;Familiarity with tools such as Microsoft Excel, Microsoft Word, Microsoft PowerPoint, Workiva, Audit Board, Archer, Teammate, ServiceNow, or other internal audit management software.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Preferred Qualifications:&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Strong attention to detail and documentation accuracy.&lt;/li&gt;&lt;li&gt;Foundational understanding of risk and control concepts.&lt;/li&gt;&lt;li&gt;Ability to learn technical systems and IT processes quickly.&lt;/li&gt;&lt;li&gt;General interest in the Information Technology field (emerging technologies, software development processes, computer networking, and authentication technologies).&lt;/li&gt;&lt;li&gt;An industry accepted certification in progress (e.g., CIA, CISA) preferred.&lt;/li&gt;&lt;li&gt;Experience with both business process and ITGC control experience a plus&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;We expect the candidate to uphold Crowe’s values of Care, Trust, Courage, and Stewardship. These values define who we are. We expect all of our people to act ethically and with integrity at all times.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Our Benefits:&lt;/b&gt;&lt;br /&gt;At Crowe, we know that great people are what makes a great firm. We value our people and offer employees a comprehensive benefits package. Learn more about what working at Crowe can mean for you!&lt;br /&gt;&lt;br /&gt;&lt;b&gt;How You Can Grow:&lt;/b&gt;&lt;br /&gt;We will nurture your talent in an inclusive culture that values diversity. You will have the chance to meet on a consistent basis with your Career Coach that will guide you in your career goals and aspirations. Learn more about where talent can prosper!&lt;br /&gt;&lt;br /&gt;&lt;b&gt;More about Crowe:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Crowe Capability Center – India, operating under the legal entity C3 India Delivery Centre LLP (formerly known as Crowe Horwath IT Services LLP) is a wholly owned subsidiary of Crowe LLP (U.S.A.), a public accounting, consulting and technology firm with offices around the world. Crowe LLP is an independent member firm of Crowe Global, one of the largest global accounting networks in the world. The network consists of more than 200 independent accounting and advisory firms in more than 130 countries around the world.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Crowe does not accept unsolicited candidates, referrals or resumes from any staffing agency, recruiting service, sourcing entity or any other third-party paid service at any time. Any referrals, resumes or candidates submitted to Crowe, or any employee or owner of Crowe without a pre-existing agreement signed by both parties covering the submission will be considered the property of Crowe, and free of charge.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;We are committed to a merit-based hiring process, evaluating all candidates consistently using objective, job-related criteria such as relevant experience, demonstrated skills, measurable impact, and alignment with the role’s responsibilities, and making employment decisions in a fair and inclusive manner free from discrimination.&lt;/p&gt;","industry":"Diversified","title":"Senior Consultant – Technology Risk & Internal Controls","datePosted":"2026-11-12","@context":"http://schema.org","occupationalCategory":"Consulting","directApply":false}</script>
