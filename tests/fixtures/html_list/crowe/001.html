<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Crowe Advisory LLC","value":"R-51654"},"hiringOrganization":{"@type":"Organization","name":"Crowe Advisory LLC","sameAs":"https://careers.crowe.com","url":"https://careers.crowe.com/job/CROCROUSR51654EXTERNALENUS/Identity-and-Access-Management-Manager","logo":"https://assets.phenompeople.com/CareerConnectResources/pp/CROCROUS/images/job_logo_config-1667320529804.jpg"},"jobLocation":[{"geo":{"@type":"GeoCoordinates","latitude":"41.8863079","longitude":"-87.6351151"},"address":{"@type":"PostalAddress","postalCode":"60606","addressCountry":"United States of America","addressLocality":"Chicago","addressRegion":"Illinois"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"32.7878191","longitude":"-96.7964899"},"address":{"@type":"PostalAddress","postalCode":"75201","addressCountry":"United States of America","addressLocality":"Dallas","addressRegion":"Texas"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"39.917335","longitude":"-86.1017365"},"address":{"@type":"PostalAddress","postalCode":"46240-0977","addressCountry":"United States of America","addressLocality":"Indianapolis","addressRegion":"Indiana"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"40.7542044","longitude":"-73.9736139"},"address":{"@type":"PostalAddress","postalCode":"10017","addressCountry":"United States of America","addressLocality":"New York","addressRegion":"New York"},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"37.7895508","longitude":"-122.4003129"},"address":{"@type":"PostalAddress","postalCode":"94105","addressCountry":"United States of America","addressLocality":"San Francisco","addressRegion":"California"},"@type":"Place"}],"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Your Journey at Crowe Starts Here:&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;span&gt;At Crowe, you can build a meaningful and rewarding career. With real flexibility to balance work with life moments, you’re trusted to deliver results and make an impact. We embrace you for who you are, care for your well-being, and nurture your career. Everyone has equitable access to opportunities for career growth and leadership. Over our 80-year history, delivering excellent service through innovation has been a core part of our DNA across our audit, tax, and consulting groups. That’s why we continuously invest in innovative ideas, such as AI-enabled insights and technology-powered solutions, to enhance our services. Join us at Crowe and embark on a career where you can help shape the future of our industry.&lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job Description:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;What It Means to Be a Consultant at Crowe&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Consulting is a dynamic business focused on solving problems for our clients and serving our core markets through innovative solutions. As technology and AI continue to reshape the consulting landscape, we are looking for individuals who are curious, adaptable, and eager to learn. At Crowe, consultants are expected to build both technical and transferable skills, think critically, and use technology to solve real business problems. In this role, you will continuously learn, collaborate across teams, and explore how tools, including emerging AI capabilities, can improve efficiency, insights, and client outcomes.&lt;/p&gt;&lt;p&gt;In management at Crowe, you play a pivotal role in leading teams, guiding project execution, and deepening client relationships. You are expected to contribute to account planning, identify opportunities to add value, and ensure high-quality delivery. As your responsibilities expand, you take on broader account ownership, balancing project leadership with growing involvement in client strategy and solution development.&lt;/p&gt;&lt;p&gt;Success in this role comes from a growth mindset, strong communication skills, advanced critical thinking, and the ability to navigate new challenges with confidence.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;We are seeking a &lt;b&gt;Manager – Identity and Access Management Architect&lt;/b&gt; to join our Cybersecurity team. In this role, you will partner with client stakeholders and Crowe leadership to define and drive identity and access management (IAM) strategy, architecture, and roadmaps across complex environments. This role combines strategic leadership with hands-on solution design, engineering and client engagement, enabling organizations to secure identities, support business objectives, and enhance user experience. The ideal candidate brings a strong understanding of emerging identity technologies and leading practices, with the ability to translate business needs into scalable, integrated IAM solutions while contributing to broader cybersecurity and risk initiatives.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;As an IAM Architect, you will serve as a strategic and technical leader helping organizations design, implement, and mature enterprise IAM programs. You will work with clients across industries to modernize identity capabilities, strengthen security posture, and enable digital transformation across cloud, on-premises, and hybrid environments.&lt;/p&gt;&lt;p&gt;This role is ideal for professionals who thrive in a fast-paced consulting environment, enjoy solving complex enterprise challenges, and are passionate about delivering practical, high-impact identity solutions.&lt;/p&gt;&lt;p&gt;As part of a growing IAM practice, this role may also support broader cybersecurity and risk engagements. This provides the opportunity to expand exposure across domains such as IT risk, security assessments, and regulatory compliance while helping build and scale Crowe’s identity capabilities.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;Key Responsibilities&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Lead IAM strategy development, roadmap creation, and reference architecture design aligned to client business objectives.&lt;/li&gt;&lt;li&gt;Define and deliver enterprise IAM architecture, including authentication, authorization, identity lifecycle management, and privileged access management.&lt;/li&gt;&lt;li&gt;Advise clients on Zero Trust principles and identity-centric security strategies.&lt;/li&gt;&lt;li&gt;Present IAM strategies, architectures, and findings to technical and executive stakeholders, including C-suite leadership.&lt;/li&gt;&lt;li&gt;Design and implement IAM solutions across cloud (Azure, AWS, GCP), on-premises, and hybrid environments.&lt;/li&gt;&lt;li&gt;Architect and integrate IAM platforms with enterprise applications, directories, APIs, and DevOps pipelines.&lt;/li&gt;&lt;li&gt;Provide guidance on modern authentication and authorization approaches (e.g., SSO, MFA, passwordless, RBAC, ABAC).&lt;/li&gt;&lt;li&gt;Lead or support implementation of modern identity and authorization platforms, including fine-grained authorization and entitlement visibility solutions.&lt;/li&gt;&lt;li&gt;Design and guide API-driven integrations between IAM platforms and enterprise systems, leveraging REST-based services and identity data flows.&lt;/li&gt;&lt;li&gt;Lead or support implementation efforts, including identity governance, provisioning, access reviews, and privileged access controls.&lt;/li&gt;&lt;li&gt;Partner with clients to accelerate onboarding and adoption of IAM and authorization capabilities, including requirements gathering, solution design, and enablement.&lt;/li&gt;&lt;li&gt;Conduct IAM risk assessments, threat modeling, and control evaluations; support remediation and continuous improvement.&lt;/li&gt;&lt;li&gt;Support regulatory compliance and alignment with frameworks such as NIST, ISO, CIS, and industry-specific requirements.&lt;/li&gt;&lt;li&gt;Apply IAM expertise within the context of enterprise cybersecurity programs, collaborating across domains such as GRC, cloud security, and data protection.&lt;/li&gt;&lt;li&gt;Contribute to broader cybersecurity engagements, including risk assessments, IT control evaluations, and security program maturity assessments, as needed to support client delivery and practice growth.&lt;/li&gt;&lt;li&gt;Collaborate with cross-functional teams including security, cloud, application development, and risk/compliance.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Qualifications&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Required Experience&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Bachelor’s degree in Information Systems, Computer Science, Cybersecurity, Engineering, or related field.&lt;/li&gt;&lt;li&gt;7+ years of experience in IAM, cybersecurity architecture, or related roles (consulting or industry).&lt;/li&gt;&lt;li&gt;Proven experience designing and implementing enterprise IAM solutions across cloud and hybrid environments.&lt;/li&gt;&lt;li&gt;Strong knowledge of authentication and federation standards (OAuth2, OIDC, SAML, SCIM, LDAP).&lt;/li&gt;&lt;li&gt;Experience with identity governance, privileged access management, and identity lifecycle processes.&lt;/li&gt;&lt;li&gt;Hands-on experience with leading IAM tools such as Entra ID (Azure AD), SailPoint, Saviynt, CyberArk, Ping Identity, Okta, or similar.&lt;/li&gt;&lt;li&gt;Broad understanding of cybersecurity domains (e.g., risk management, IT controls, cloud security, or compliance frameworks).&lt;/li&gt;&lt;li&gt;Familiarity with Zero Trust principles and modern identity security approaches (e.g., MFA, passwordless, RBAC/ABAC).&lt;/li&gt;&lt;li&gt;Experience with API-based integrations and identity data flows (e.g., REST APIs, JSON, or similar patterns).&lt;/li&gt;&lt;li&gt;Familiarity with scripting or automation (e.g., Python, SQL, or similar) to support identity integrations or data analysis.&lt;/li&gt;&lt;li&gt;Experience supporting or leading IAM implementations, transformations, or program development efforts.&lt;/li&gt;&lt;li&gt;Understanding of non-human identities (e.g., service accounts, APIs, workloads, AI agents) and emerging identity considerations for AI/automation, including governance of machine and agent-based access.&lt;/li&gt;&lt;li&gt;Professional certifications such as CISSP, CISM, CRISC, or IAM/vendor-specific certifications.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Preferred Qualifications&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Experience in regulated industries (e.g., financial services, healthcare, government).&lt;/li&gt;&lt;li&gt;Familiarity with AI/automation in cybersecurity or identity governance.&lt;/li&gt;&lt;li&gt;Familiarity with workflow and governance platforms (e.g., ServiceNow), including support for identity-related processes such as access requests, approvals, and risk/compliance workflows.&lt;/li&gt;&lt;li&gt;Strong analytical, problem-solving, and stakeholder management skills.&lt;/li&gt;&lt;li&gt;Strong communication skills with the ability to translate technical concepts into business terms and engage with senior stakeholders.&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;#Hybrid&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;We expect the candidate to uphold Crowe’s values of Care, Trust, Courage, and Stewardship. These values define who we are. We expect all of our people to act ethically and with integrity at all times.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;In compliance with federal law, all persons hired will be required to verify identity and eligibility to work in the United States and to complete the required employment eligibility verification form upon hire. Crowe is not sponsoring for work authorization at this time.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;The wage range for this role takes into account the wide range of factors that are considered in making compensation decisions including but not limited to skill sets; experience and training; licensure and certifications; and other business and organizational needs. The disclosed range estimate has not been adjusted for the applicable geographic differential associated with the location at which the position may be filled. At Crowe, it is not typical for an individual to be hired at or near the top of the range for their role and compensation decisions are dependent on the facts and circumstances of each case. A reasonable estimate of the current range is $104,500.00 - $213,800.00 per year.&lt;br /&gt;&lt;p&gt;&lt;b&gt;Our Benefits:&lt;/b&gt;&lt;br /&gt;Your exceptional people experience starts here. At Crowe, we know that great people are what makes a great firm. We care about our people and offer employees a comprehensive total rewards package. &lt;a target=\"_blank\" href=\"https://www.crowe.com/careers/why-crowe/benefits\"&gt;Learn more about what working at Crowe can mean for you!&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;br /&gt;&lt;b&gt;How You Can Grow:&lt;/b&gt;&lt;br /&gt;We will nurture your talent in an inclusive culture that values diversity. You will have the chance to meet on a consistent basis with your Career Coach that will guide you in your career goals and aspirations. Learn more about where talent can prosper!&lt;br /&gt;&lt;br /&gt;&lt;b&gt;More about Crowe:&lt;/b&gt;&lt;br /&gt;Crowe provides professional services through two separate entities: Crowe LLP delivers audit and attest services, and Crowe Advisory LLC provides tax, advisory, consulting, and other nonattest services.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;The Crowe Global network consists of more than 300 independent accounting and advisory services firms in more than 150 countries around the globe, making it one of the largest accounting networks in the world*. As independent members of Crowe Global, Crowe LLP and Crowe Advisory LLC serve clients worldwide. (*As of July 2026)&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Crowe LLP and Crowe Advisory LLC (and their respective subsidiary entities) provides equal employment opportunities to all employees and applicants for employment and prohibits discrimination and harassment of any type without regard to race, color, religion, age, sex, sexual orientation, gender identity or expression, genetics, national origin, disability or protected veteran status, or any other characteristic protected by federal, state or local laws.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Crowe LLP and Crowe Advisory LLC (and their respective subsidiary entities) does not accept unsolicited candidates, referrals or resumes from any staffing agency, recruiting service, sourcing entity or any other third-party paid service at any time. Any referrals, resumes or candidates submitted to Crowe, or any employee or owner of Crowe without a pre-existing agreement signed by both parties covering the submission will be considered the property of Crowe, and free of charge.&lt;/p&gt;&lt;br /&gt;Crowe will consider for employment all qualified applicants, including those with criminal histories, in a manner consistent with the requirements of applicable state and local laws, including the City of Los Angeles’ Fair Chance Initiative for Hiring Ordinance, Los Angeles County Fair Chance Ordinance, San Francisco Fair Chance Ordinance, and the California Fair Chance Act.&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;a target=\"_blank\" href=\"http://careers.crowe.com/ban-the-box-and-fair-chance-hiring-notices\"&gt;Please visit our webpage&lt;/a&gt; to see notices of the various state and local Ban-the-Box laws and Fair Chance Ordinances, where applicable.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;We are committed to a merit-based hiring process, evaluating all candidates consistently using objective, job-related criteria such as relevant experience, demonstrated skills, measurable impact, and alignment with the role’s responsibilities, and making employment decisions in a fair and inclusive manner free from discrimination.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;If you are interested in applying for employment with Crowe and are in need of an accommodation or require special assistance to navigate our website or to complete your application, please visit our Applicant Assistance and Accommodations page for more information: &lt;a target=\"_blank\" href=\"https://careers.crowe.com/crowe-applicant-assistance-and-accommodation\"&gt;&lt;u&gt;https://careers.crowe.com/crowe-applicant-assistance-and-accommodation&lt;/u&gt;&lt;/a&gt;&lt;/p&gt;","industry":"Diversified","title":"Identity and Access Management Manager","datePosted":"2026-10-12","@context":"http://schema.org","occupationalCategory":"Consulting","directApply":false}</script>
