# Canonical tech tag dictionary for ARCHITECTURE.md section 6 (rule 10).
#
# tag: canonical name (lowercase).
# aliases: lowercase strings matched on word boundaries against title + description text.
#   Aliases are unique across tags (a collision would make the match ambiguous).
# requires_context: optional regex. When present, the tag (any alias) only counts if the
#   regex also matches the same text. Used for tokens that are common English or other
#   words: go, r, c, swift, rust, spark, elixir, dart, ruby, julia, scala (ARCH 6.10).
#   The regexes are Python re patterns, run against lowercased text.

