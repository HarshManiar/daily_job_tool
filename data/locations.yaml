# Phase-1 location table for ARCHITECTURE.md section 6 (rule 5). Built-in only;
# Phase 4 replaces it with GeoNames.
#
# countries: ISO 3166-1 alpha-2 code (uppercase, quoted so YAML does not read 'NO'/'ON' as
#   booleans), lowercase name, and lowercase aliases. Aliases include common short forms
#   and historical names. 'us' is not an alias: it reads as the pronoun.
#   Covers the 193 UN member states plus Taiwan and Palestine (195 entries).
# regions: lowercase token -> {kind, countries}. kind 'region' lists ISO codes; kind 'world'
#   has an empty list meaning all countries. EU is the 27 current members.
#   Europe is geographic (includes GB, TR, RU, UA); EMEA = Europe + Middle East + Africa;
#   APAC = Asia + Oceania (excluding the Middle East).
# us_states / ca_provinces / au_states: code -> lowercase name. DC is included as a
#   US admin1 because Washington, DC is matched through it.
# cities: name (lowercase), admin1 (state/province code for US, CA, AU; null elsewhere),
#   country (ISO code), aliases. Ambiguous names (portland, london, cambridge, newcastle,
#   san jose, victoria, columbia) appear once per place; matching ranks by admin1/country.

