# Example owner profile. Copy to data/profile.yaml (gitignored) and edit.
#
# The loader (src/daily_job_tool/match/profile.py) reads data/profile.yaml when
# present and falls back to this file. Every section below is optional; missing
# keys take permissive defaults. Replace the placeholder values with your own.
#
# target_titles   Job titles you want, in three tiers (tier1 = best fit, tier3 =
#                 stretch). Titles are matched loosely against posting titles.
#   generic_data_roles  Regexes that catch broad data roles at any company.
#                 exclude_title_regex drops seniority levels you do not target.
#
# hard_filters    Jobs failing these are dropped entirely.
#   employment    full_time_only excludes contract / temp / C2C roles.
#   max_age_days  Only postings newer than this many days.
#   years_required  Drops roles whose minimum required years fall outside min..max.
#   exclude_companies  Employers you will not apply to (e.g. your current one).
#   exclude_staffing_reposts  Drop staffing-agency reposts of other postings.
#   visa          exclude_if_phrases removes postings that rule out your work
#                 authorization; flag_if_phrases marks postings that offer sponsorship.
#
# location_priority  Ordered preferences. Earlier entries rank higher. Jobs that
#                 match no entry are still shown, ranked lower. Each entry may use
#                 states, cities, or remote_regions.
#
# industry_priority  RANKING BOOST ONLY. Jobs in other industries are still included.
#
# profile         Free-form facts used when scoring fit: a one-line summary, data
#                 sources or domains you know, skills you have, skills you lack
#                 (penalized, never excluded), skills to count as matches, and an
#                 optional minimum base salary (USD). Unknown pay is kept.

target_titles:
  tier1:   # highest odds
    - Data Analyst
    - Senior Data Analyst
    - Analytics Engineer
  tier2:   # good odds
    - Business Intelligence Analyst
    - Reporting Analyst
    - Data Engineer
  generic_data_roles:   # broad data roles at any company (tier 2 unless a tier-1 title matches)
    title_regex:
      - data\s+analyst
      - (senior|sr\.?)\s+data\s+analyst
      - data\s+engineer
      - analytics\s+engineer
      - (bi|business\s+intelligence)\s+(analyst|developer|engineer)
      - (business|reporting|insights?)\s+analyst
      - data\s+scientist
    exclude_title_regex: [intern, director, vice\s+president, \bvp\b, principal, staff, head\s+of, manager]
  tier3:   # stretch, only if the description strongly matches your skills
    - Product Analyst
    - Analytics Consultant

hard_filters:
  employment: full_time_only        # exclude contract, C2C, W2-contract, temp
  max_age_days: 14                  # posted within; posting must still be open
  years_required: {min: 2, max: 6}  # exclude roles whose MINIMUM required years is outside this range
  exclude_companies: [YourCurrentEmployer]
  exclude_staffing_reposts: true
  visa:
    status: none                    # none = visa filters off; h1b_transfer_needed = drop postings that rule out sponsorship
    exclude_if_phrases:             # case-insensitive regex; matching postings are dropped
      - no\s+(visa\s+)?sponsorship
      - (will\s+)?not\s+(be\s+able\s+to\s+)?(provide\s+|offer\s+)?(visa\s+)?sponsor
      - sponsorship\s+(is\s+)?not\s+(available|offered|provided)
      - visa\s+sponsorship\s*:\s*(not\s+available|no)
      - without\s+(the\s+need\s+for\s+)?(visa\s+)?sponsorship
      - (u\.?s\.?\s+citizens?|green\s*card)\s+(only|required)
    flag_if_phrases:                # matching postings are kept and marked
      - (we\s+)?(will\s+)?(provide|offer)s?\s+(visa\s+)?sponsorship
      - sponsorship\s+(is\s+)?(available|offered|provided)
location_priority:   # order of preference; everything else still shown, ranked lower
  - {name: anywhere_us, remote_regions: [US]}   # Anywhere in US
industry_priority:   # RANKING BOOST ONLY; jobs at any other industry are still included
  - software
  - fintech
  - healthcare

profile:
  summary: One-line description of your background and what you are looking for.
  data: [your data sources or domains, e.g. product analytics, billing data]
  strong_skills: [sql, python, dbt, tableau]
  gap_skills: [spark, airflow]   # penalize, never exclude
  treat_as_match: [aws]
  min_base_usd: 100000           # roles with a stated max below this are flagged "low pay"; unknown pay is kept
