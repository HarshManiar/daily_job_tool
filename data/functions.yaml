# Controlled function vocabulary for ARCHITECTURE.md section 6 (rule 4).
#
# Ordered: the first function whose title_keywords match wins. Title keywords are matched
# as whole words or phrases against the normalized title (ARCH 6 rule 4: title first, then
# the ATS department hint in department_keywords, then 'other'). The order is deliberate:
#   ml_ai before data before engineering (ml engineer, data engineer)
#   security, devrel, sales, support, it before engineering (security engineer,
#     developer advocate, sales engineer, support engineer, network engineer)
#   design before product and marketing (product designer, product marketing)
#   product before operations (product operations) and before engineering (only specific
#     product phrases are listed, so 'product engineer' falls through to engineering)
#   research before design (ux researcher) but 'research engineer' falls to engineering
#   'other' is the explicit fallback.
#
# department_keywords are matched against the ATS department/team name, lowercased.

